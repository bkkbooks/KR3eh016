body:
  text: 辨言人身一小天地大都不外陰陽虛實四字故燮理得宜愆伏可以不患調劑有法疾病因之無虞是在司命者有以辨之而已苟臨症疏略不暇加辨以致毫釐千里誤人於俄頃者曷可勝嘆此陳子遠公辨症玉函之所為著也陳子為于越世胄幼抱匡濟恆以公輔自命人亦無不以公輔期之齎志未售間留心於經世之學當途者𣪞勤徵聘爭欲延致後因遠陟蒼梧雅慕獨秀棲霞諸勝遍歷幽隱遇一龐眉修髯衣冠岸偉者相與坐語移日因出其囊中一編授之曰熟此可以普濟世人蓋活人於筆端與活人於指下均之躋斯民於壽域也陳子攜歸展讀悉岐黃辨論問答語與世之所傳內經素問諸書迥異始悟前此之成編纍帙皆僞託以行世者陳子掩𮤚肄習不數年間即以醫學擅名於時客歲余仲子忽嬰異症遍召諸醫不特不能祛病使去並不能辨病所自來轉輾遷延經年彌劇蒼崖姜世兄親見所苦因為推轂適陳子以秋試入省亟延疹視一劑奏功再服而十減四五矣餘力扣其所蘊知授受有自大異尋常殊恨相知之晚也陳子隨有巨鹿之遊瀕行出是編以示余曰是書吾久欲問世憾剞劂無資有懷未遂耳因憶當年余白下友人有居要津者向有膏丹異方頗自珍祕余偶過告歸主人厚贐以壯行色余堅卻不受且請曰歸裝粗辦不敢以行李相纍惟得所藏祕方以廣利濟是吾顧也友人誼余言探囊録授余歸即購求珍藥按方虔製出遇有疾患呻吟者輒牽止異之靡不立效後請乞漸廣窮鄉僻壤山陬海澨梯航跋踄款門祈懇者無虛日惟不喜給富人為其力能療治也余行之數十年未嘗有怠色雖歲有所損然拯患而起廢者當不可以數計矣今乃祕帙當前歷有成驗忍於寶山空返耶爰為授梓以公當世倘陳子游屐所不及至疹視所未及施庶幾執是編辨症而區處之不無小補知不徒為紙上陳言也陳子所輯洞垣祕笈尚富未能一一鋟行其以是編為嚆矢也可時康熙癸酉嘉平之望天都王之策慎庵氏題於古修堂
