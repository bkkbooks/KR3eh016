body:
  text: 卷之三利上症下症辨怔忡怔忡之症本是心氣之虛如何分為上下其故實有至理而世人未知也肺脈居於心之上肺氣有養則清肅之令下行足以制肝木之旺肝木不敢下克脾土脾土得令自能運化以分津液而上輸於心而後心君安靜無為何致有怔忡不定之病耶此所謂上症之源流也因肺金失令則肝木寡畏以克脾土脾土為肝所制事肝木之不暇又安能上奉於心乎心無脾土之輸而肝木又旺自己尊大不顧心君之子此心所以搖搖靡定而怔忡之症起矣但怔忡上病何以知之其症必兼咳嗽而飲食能食而不能消者是也方用安止湯此方合肺脾心肝四臟之藥以治之也一劑而少定再劑而更安十劑而怔忡之病可以全愈矣其下病奈何其症吐痰如清水飲食知味而苦不能多聞人言則驚見天光可畏時時懊憹刻刻煩悶此病乃腎水耗竭不能上輸於肝木而肝木自顧不遑又安能上養於心乎心血既耗又安能下通於腎心腎交困怔忡時生不止痰氣之作祟也治用消煩湯此方乃補心肝腎之聖藥三經大補則氣血精皆足雖有痰氣不清又有白芥子以消其痰於膽膈之中豈尚有怔忡之不定乎自然煩去而心安悶除而魂靜也安上湯人參三錢茯神五錢麥冬五錢北五味一錢丹參二錢柏子仁二錢半夏一錢丹砂一錢菖蒲二錢白朮五錢枳殼三分神麯五分白芍五錢水煎服消煩湯熟地一兩山茱萸五錢白芍五錢當歸五錢黃耆五錢人參五錢牛膝五錢巴戟天五錢菟絲子五錢枸杞子五錢炒棗仁五錢白芥子五錢山藥五錢水煎服痿症痿症之不起床也人以為兩足之無力非下病而何殊不知痿症不同有上下之分焉上痿者非手痿之論乃肺氣與陽明之病也雖痿症皆屬之陽明治痿不治陽明終難起廢然而陽明有兼肺經而痿者實是上病而非下痿之可比其症必咳嗽吐膿吐痰而雙足無力則與下痿之症頗同而治法不可與下痿之病同治也吾今立一方治上痿者神妙名為起痿上清丹此方仍是治陽明之藥而妙在用金銀花以治肺中之痿清其肺氣自然下生腎水腎水生而骨中之髓自生又何必更補腎哉況方中俱是輕清散火之味輕清則上升以散其肺中胃中之火則陽明火焰自然不上衝於肺而肺氣安寧又可不辨而自知也至於下痿之症雖治法不能離於陽明然必竟以補腎為主蓋兩足之無力本是骨中無髓而髓乃腎中之精也不補其精則髓從何出況陽明胃經乃腎之關門補腎正所以補胃耳其症能食而飢面紅如火晝輕夜重吐痰如水者是也方用堅骨起痿丹此方妙在補腎而兼補胃也可統治下痿之症無不神效但痿病非一二劑可以奏功願人遵守吾方朝夕吞嚥斷無久臥床蓆之人也起痿上清丹麥冬五錢金銀花二兩玄參一兩北五味一錢薏仁一兩生地五錢天門冬五錢天花粉三錢甘菊花三錢黃耆三錢陳皮一錢人參五錢水煎服堅骨起痿丹熟地三兩山茱萸二兩牛膝五錢金釵石斛五錢薏仁二兩山藥一兩白朮五錢玄參五錢麥冬五錢丹皮五錢地骨皮五錢白芥子三錢水煎服氣病氣病何以分上下也如有人氣逆沖而上兩脅飽滿又不作喘又不咳嗽痰如核結欲吐不可欲下甚難謂非氣之上症而何治之法又不可徒治其上也此等之症非憂鬱而得之即惱怒而成之也方用逍遙散最佳不必更立奇方耳如有人氣崩迫於下兩腹作脹欲瀉不能不瀉更急大便燥結小便短少臍下作痛而不可忍或環臍而痛或兩足俱腫謂非氣之下症而何而治之法又不可徒治其下也此等之症雖亦因憂鬱惱怒而來然何以氣不上而反下蓋上焦無火其氣無隙可乘見下有可下之機故隨之而下奔調其中而解其鬱亦非難治故其勢較上衝者反重而治之實易也亦用逍遙散和解之亦隨手而愈然則予又何必取而細辨之乎不知方可兼用而症不可混觀辨明上下之症而於逍遙方中上病加蘇子降氣之味下病增梔子瀉火之品又何至臨症之曠顧哉痰症痰症之分上下者其故何哉痰在胃中者上也痰在脾中者下也痰在腎中者下之下也世人謂肺中有痰者誤蓋肺乃嬌藏一物不容如何有痰肺痰者因肺有病因謂之也其實皆胃中之痰耳若心亦有痰肝亦有痰二皆因其病而命名而終不可謂心肝有痰不統之於胃中也故言胃而凡有在上之痰舉皆包之矣治上之痰奈何健其胃而清其痰補其氣而利其濕治上焦之痰其庶幾乎然而上痰終何以辨之必感風寒而得之或黃或白或成磈而膠結不開或嘔吐而終朝不已或胸悶而作脹或鼻塞而氣粗或咳嗽而隨吐或咯唾而難出或如敗絮或如黃膿此皆上痰也我有一方可以通治之神效方名攻痰散此方健胃補氣又兼利濕消痰而去風也痰在下者雖有脾腎之別而症實相同脾氣之虛而後腎水之泛腎氣之乏而後脾土之虧原相因而至也其症則有純吐清水者蓋命門無火則水寒命門無火則土亦寒水土既寒又何有堤防之障哉勢必狂潤洶湧上騰氾濫而不可止遏方用返流湯一劑而痰靜再劑而痰消四劑而痰無矣此方妙在以白朮為君健脾而佐之以補腎消痰之藥引水歸源而先堅其土氣俠水不能蕩其土則土自然能制夫水也攻痰散白朮三錢茯苓五錢柴胡一錢白芍五錢半夏三錢神麯一錢黃芩一錢甘草一錢天花粉二錢水煎服返流湯白朮一錢山藥五錢薏仁五錢芡實五錢山茱萸五錢北五味二錢肉桂二錢人參三錢白芥子五錢水煎服癆病癆病之宜分上下也五臟過勞皆能成癆何以止分上下不知五臟成癆非由上以損下即由下以損上也故言上下而五臟之癆症已不外於此也又何必逐臟以細別之乎由上而損下者何如大約先損其心而後傷於肺肺傳之肝肝傳之脾脾傳之腎而後死也其症之外見者若何心驚不寐咳嗽吐痰飲食少思兩脅微悶夢遺不休身發潮熱足膝無力此等之症初起之時補其陽虛而少佐之滋陰之品自易奏效無如世人不知治法妄用消痰降氣克削之劑不至於成癆不已其已成癆又不用殺蟲之藥於大補氣血之中無怪乎奄奄垂絕也吾今憫惜世人特傳奇丹於初病之時於已病之時急用吾方皆可回春方名補上救癆丹此方之妙平平無奇而實有奇效乎補之中而寓以剿殺之計所以奏功如響也由下而上損者如何因房勞而起也先損其腎腎傳之心心乃傳之肺肺傳之肝肝傳之脾脾仍傳之腎其症身先發熱骨蒸多汗以致夢寐恍惚吐痰不已似飢非飢似痛非痛脅脹心跳腹瀉腸鳴不可勞役力難勝任久則奄奄臥床難於起立者是也若誤認作陽虛誤用參耆必致陽愈旺而陰愈消咳嗽吐血唾血衄血而不能止夢遺精滑強陽不倒骨髓作酸頭暈眼花惡症種種不可枚舉誰知皆是不慎女色而然也必須大用補陰而加之化蟲之味始能奪命返魂重登壽域否則行屍坐鬼不過旦夕為世上之人而已吾今傳一奇方專治下癆實見奇功方名重春奪命丹此方妙在地骨皮同鱉甲地慄同用蓋癆病未有不骨髓內熱者地骨入於骨中以清其虛熱鱉甲無孔不鑽與地慄粉相濟有蟲則殺有隙則填陰虛則補陽旺則衰三者並用實有至理況各品又純是補陰制陽之味陰足而陽有不平者乎此方之所以神而肆也補上救癆丹麥冬三兩生棗仁三兩炒棗仁三兩山藥六兩芡實六兩地骨皮六兩丹皮六兩當歸六兩白芍一斤人參三兩北五味二兩橘紅八錢白薇三兩神麯三兩茯神三兩萬年青三片薏仁五兩天門冬六兩各為細末蜜為丸每日空腹服五錢早晚各一服重春奪命丹熟地一兩山茱萸五錢麥冬五錢北五味一錢薏仁五錢芡實五錢山藥五錢地骨皮一兩丹皮五錢地慄粉五錢鱉甲末三錢生何首烏三錢菟絲子三錢砂仁一粒人參三分水煎服心驚心驚本是上症而余分上下者有故心與腎相通心氣不下交於腎則能成驚而不寐腎氣不能上交於心亦能不寐而成驚也故症須分別而治法亦宜各異也但二症何以別其在上在下乎大約心不交腎者終日不寐而腎不交心者終夜難眠耳以此分別最得病情若人有心驚不寐於日者用止驚補心湯一劑即寐二劑而心驚少安矣四劑全愈此方補心而不補腎惟引其心腎之合而不必治腎經之虛也蓋腎氣原未常大虛補其心而腎不必上之於心則腎氣有養又何至心腎之不交哉心驚而夜不寐此腎水之竭急用定驚補腎湯此方妙在大補腎水而不去補心腎足原能上通於心也方中用肉桂黃連相濟成功蓋二物同用原能交心腎於頃刻況又有腎經之味大壯其真水之氣則水火既濟亦何至驚悸而不寐哉止驚補心湯人參五錢白朮五錢茯苓五錢炒棗仁五錢丹砂二錢竹茹一丸遠志一錢甘草一錢麥冬五錢黃連三分肉桂三分半夏八分北五味一錢水煎服定驚補腎湯熟地一兩山茱萸五錢山藥五錢北五味二錢牛膝三錢葳蕤五錢當歸五錢丹皮三錢沙參一兩薏仁五錢芡實五錢白芥子三錢肉桂一錢黃連二分巴戟天五錢白朮三錢水煎服中滿中滿之宜辨上下也既曰中滿矣似於病不在上病在下矣不知中滿中宮似滿也非肺氣之虛以成滿即腎氣之虛以成滿也肺氣苟旺則清肅之道下行胃脾且奉令之惟謹又何至有飲食之阻滯以成中滿哉惟其肺氣之衰清肅之令不行於中州於是肝木寡畏來克脾胃之土中州受禍賊人截路糧道不通而中滿之病生矣其症胸寬微飽吞酸吐酸能食而不飢既食而作脹此皆上病而非下病也法當用健土製肝之味尤宜用補肺扶金之藥始為得之方用助金制滿湯此方補氣以助肺金薏仁山藥之類以培土氣枳殼蘿蔔子之類消食以去脹滿此方之相制而相成也初服之時少覺微悶久服自通倘不知此等妙法而妄用削刻消導之品初覺快而後覺甚矣此塞因塞用實有妙機也至於腎虛成滿者半由於脾之寒而脾之寒又因於命門之火少也釜底無薪何能煮爨腎氣既虛下不能消必反而上此所以成中滿之症也其症必腹寒而時痛小便清長大便閉塞蓋大腸之能開能合腎操權也今腎水乾涸則大腸無水以潤之日日煎熬腸亦細小腸既細小水穀難化而糟粕之類不能直達於肛門勢必停積於下流下流既閉塞勢必上反而中滿此等之病即翻胃之漸也世人以翻胃為脾腎之症誤矣當急補其腎水而更益之以命門之火蓋此水乃真水也真水非真火不能生水中補火正火中補水也水生而大腸有水以相濟則舟舶可以相通糧路可以輸挽下既無阻抑之途則中自無飽滿之苦倘不知此等妙論而徒用大黃牽牛之類以峻攻之徒取一時之寬快反成日久之閉結轉利轉虛遂成不可救藥之病矣方用寬中散此方純補腎經而少佐之以補肝使肝木平和不來剋土則腎水更能潤澤於大腸大腸既潤又何隔塞之不通哉此又不治中滿而正所以治中滿也人又不可不知之耳助金制滿湯人參一錢白朮一錢茯苓三錢神麯一錢甘草一分蘿蔔子一錢大腹皮五分枳殼五分山藥五錢薏仁五錢山楂五粒麥芽一錢穀芽一錢水煎服寬中散熟地二兩白芍五錢當歸五錢麥冬五錢牛膝三錢玄參三錢葳蕤五錢車前子一錢鱉甲五錢龜膠三錢山茱萸三錢山藥五錢丹皮三錢沙參三錢水煎服關格關格之症原有上下之分一上格之而不得入一下關之而不得出也上下既有相殊治法亦宜各異大約上格之而不得入者當治肝下關之而不得出者當治脾然而開鬱行氣則上下皆同也上格之症水食俱不可下一得水食則吐出兩脅飽脹氣逆拂抑而覺氣不能通初起之時以逍遙散和解之何致成不可救藥之症惟其不與此湯也則肝木終無解時又加另服他藥則愈加脹悶吾今定一方緩緩呷之自然重門漸開轉輸有路矣下關之症大小便俱不能出上食水穀覺脹悶欲死氣急而息粗初起之時亦以逍遙散和之亦隨手奏功而無如人之不識也則脾氣轉燥而肝木來凌大小腸火勢阻遏而不能下達其勢甚急然而較上格之症實少輕也蓋邪在上難於發泄邪在下易於推蕩也用四物湯加大黃柴胡於補中兼下而散之則火鬱可開關門中啟矣誰謂關格之症可不分上下以治之乎增補逍遙湯白芍三錢白朮一錢枳殼一錢當歸三錢柴胡一錢香附一錢甘草五分川芎一錢炒梔子一錢茯苓三錢陳皮五分天花粉一錢竹瀝五匙水煎服
