body:
  text: 卷之二亨虛症實症辨咳嗽咳嗽之宜辨虛實也初嗽之時多是實久嗽之後多是虛肺主皮毛一感風寒便成咳嗽痰氣住於胃腕之間而不得散鼻塞流涕而不已其咳嗽之聲必響其吐痰亦必或黃或緑重且身熱而喉痛嗑干胸中膨悶而不可解此皆邪氣之實也若以為劑則邪未散而氣更壅滯矣故初起之風藥解散為第一惟世人治嗽實多其方者無幾也吾今酌定一方可以為永遠之名寧嗽丹此方祛風祛痰又不耗氣治初起之咳嗽殊有神功大約二劑無不愈者此治實症之咳嗽人幸存而收之又何必用柴胡防風過於消散哉至於肺虛嗽症非脾胃之虛即腎肝之涸也咳嗽至於日月之久若有風邪即不服藥亦宜自散今久而不愈因脾氣不健土不能生肺金則邪欺肺氣之無親況土虛則肝木必然過旺又來克脾而金弱不能相制則邪氣無所顧忌盤踞於肺中而不去或日久而成嗽也然何以知其脾氣之虛以致其久嗽之不已論其飲食則能食而不能消口欲餐而腹又飽或溏瀉而無休或小便之不謹皆是脾虛作嗽也法當用培土之味而益之止嗽之品方名土金丸每日白滾水送下五錢半料即全愈此方全不治嗽而嗽自安蓋健脾之氣而肺氣有養邪自難留故不止嗽而嗽自已也肝經之虛以致久嗽者何故肺金本克肝木肝木之虛肺金免乎制伏宜於肺氣之有養矣何得反致咳嗽不知肝木之氣必得肺金之制而木氣始能調達今因肝木素虛而風又襲之筋不能疏益加抑鬱而不伸此咳嗽之未能痊也法當舒肝中之郁滋肝中之津而金氣始能彼此之相通而不致上下之相隔庶幾嗽有止時也然而肝虛之症又從何而辨之問其人必兩脅作脹悶之狀或左邊之疼痛而手不可按或面目之青黑而氣無開或胃脘作酸而欲吐或痰結成小塊而咽在喉嚨或逢小怒而咳嗽更甚此皆肝虛咳嗽之病也世人治肝經之咳嗽原無方法動以老痰呼之誤之甚矣吾今立一方專治肝虛作嗽之症神效之極方名木金兩治湯此方之妙全去舒肝而不去治肺蓋久嗽則肺氣已虛何可又虛其虛故不用風藥以散肺金之氣也然則何不補肺金之氣耶不知肝虛所以久嗽若又去助肺則仍又致肝木之不得伸何若竟補肝舒木之為得耶況方中祛痰祛風於表裡膽膈之間又未嘗不兼顧肺邪也此方之所以神而妙耳腎虛之嗽更自難明肺為腎之母子母相戀豈有相忌而作嗽之理殊不知肺金之氣夜臥必歸息於腎宮所謂母臟子舍也今肺金為心火風邪所凌逼既無衛蔽勸解之人又無祛逐戰爭之士束手受縛性又不甘自然投避子家號召主伯亞旅以復其仇子母關切安忍坐視自然統領家人騰上祛邪無奈強鄰勢大賊衆瞞天而其子又國衰民弱不能拒敵逃竄披靡肺金之母不得已仍回己家而腎宮子水敵既未除而家人星散亦且民作為盜不復仇而反助仇矣於是水化為痰終年咳嗽而不能愈也法當專補腎水而兼益肺金之氣其症始可安然然腎虛作嗽之症若何辨之飲食知味可飲可食全無相礙惟是晝輕夜重夜汗則淋漓或夜熱之如火或聲嘶而口不幹或喉痛而舌不燥痰涎純是清水投之水中而立化或如蟹之涎純是白沫皆腎虛咳嗽之症也論方莫妙用八味地黃湯去桂附加麥冬五味大濟煎飲必能奏功如響然而可作丸而不可作湯誠恐世人不知倦於修合吾今另定奇方可代地黃之湯也方名水金兩治湯此方奇絶補腎補肺而又加去火之劑使骨髓之虛火皆安又何慮外邪之相犯腎中不熱則水氣相安自然化精而不化痰況方中又有薏仁車前以利其膀胱之氣分消敗濁而精益能生非漫然而用之也願人加意吾方以治腎虛之咳嗽又奚至經年纍月受無窮之纍哉寧嗽丹甘草二錢桔梗三錢黃芩一錢陳皮一錢天花粉二錢麥冬三錢蘇葉一錢水煎服土金丸白朮三兩茯苓三兩甘草一兩人參一兩半夏一兩桔梗一兩白芍三兩麥冬三兩乾薑一兩神麯五錢陳皮五錢薏仁三兩各為末蜜為丸木金兩治湯白芍一兩當歸五錢柴胡三錢炒梔子二錢蒼朮二錢甘草一錢神麯一錢白芥子三錢或五錢防風五分枳殼五分水煎服水金兩治湯熟地一兩山茱萸五錢麥冬一兩北五味三錢車前子三錢薏仁一兩玄參三錢地骨皮五錢牛膝二錢水煎服喘症喘症之有虛實也喘症遇風而發此實邪也可散邪而病輒愈其症喉作水雞聲喘必抬肩氣悶欲死視其勢若重而其症實輕蓋外感之病而非內傷之患也方用射干止喘湯一劑即愈不必再劑也此方雖皆祛邪散風之品而有補益之味以相制邪去而正氣無虧倘無補味存乎其中但有散而不補風邪雖去喘亦頓除後日必有再感之患不若乘其初起之時預作綢繆之計也至於虛喘若何口中微微作喘而不至抬肩蓋短氣之症似喘而非喘也問其症必有氣從臍間上衝便覺喘息不寧此乃腎虛之極元陽止有一線之微牽連未絶而欲絶也法當大補腎宮之水而兼補元陽之氣則虛火下潛而元陽可續方用生水歸源散此方神而更神此等之病非此等之方不能回元氣於將亡補真水之乘絶一劑而喘輕再劑而喘定三劑四劑而安寧矣庶幾身可眠而氣無上衝之患矣倘不用吾方自必斃或少減乃亦能奏效然而曠日遲久徒增困頓與其後日多服藥餌過於吾方之多何若乘其初起之時即照吾定之方而多與之痛飲能去病之為快哉射干止喘湯射干二錢柴胡一錢麥冬三錢茯苓三錢半夏三錢甘草一錢天花粉一錢黃芩一錢蘇子三錢百部一錢水煎服生水歸源散熟地三兩山茱萸一兩人參三兩牛膝五錢麥冬三錢車前子五錢北五味三錢胡桃仁五個生薑五片水煎服雙蛾雙蛾症之虛實從何辨之大約外感者為實內傷者為虛而外感內傷又從何而辨之大約外感者鼻必寒舌必燥身必先熱而後寒痰必黃而白目必赤而浮此邪氣之實也用殺蛾丹治之用鵝翎吹入喉中必吐痰涎碗許而愈神方也內傷者雖同是為蛾喉腫而日間少輕痰多而舌必不燥吐痰如湧泉而下身必畏寒兩足必如冰冷此正氣之虛也用八味湯必然奏功吾今更定一方名為三陸同補湯此方之妙妙在水中補火水足而肺經有養亦火溫而土氣有生則肺經兼有養也況方中原有生肺之品而肺金有不安寧者哉肺腎脾三經俱安則邪何所藏自難留戀於皮膚之內邪退而腫自消雙蛾頓失其形真有莫知其然而然者矣殺蛾丹硼砂一分丹砂三分牛黃一分冰片一分兒茶一錢麝香一分石膏一錢各為絶細末三陸同補湯熟地一兩山茱萸五錢麥冬一兩北五味二錢薏仁一兩肉桂二錢人參一錢白芥子五錢茯苓五錢白朮五錢水煎服目痛目痛有虛有實實痛之症必然紅腫流淚結眵或如錐傷或如砂入羞明喜暗見日光而如觸對燈影而若刺起障生星發寒發熱吐痰吞酸大便實而小便黃此皆邪火之實症也治之法必須散邪解熱祛痰為主倘遽以補藥為先愈助其火勢之焰痰且不得消而邪且不易散方用瀉火全明湯治之此方之妙妙在用玄參之多以解散浮游之火而各藥無非入肝舒木之品去濕熱而除風邪消痰結而培土氣不治目而正所以治目也虛痛之症色必淡紅即紅而亦不甚痛雖羞明而無淚雖畏明而無星大便如平時小便必清長有痰亦不黃畏寒而無涕此腎肝之虛症也治之法必須補水舒肝為主倘然以逐邪散火為先勢必輕變重而重必變盲矣方用溫補救目散治之此方肝腎兩補而尤注意於肝雖肝木之枯由於腎水之竭以致肝木不能養目然而肝氣雖必得腎水以相資必竟目為肝養補肝則目自然有光故補腎尤須補肝之為先也世人治虛眼之方原無佳法一見目痛動以風藥治之往往壞人之目倘聞吾之教而辨其虛實毋論或先或後實者用前方虛者用後方則目病必能隨手回春何致有失明之嘆哉可見虛實之必宜辨明而用藥之不宜少差也瀉火全明湯柴胡二錢草決明三錢甘菊花二錢玄參五錢炒梔子二錢甘草一錢天花粉三錢白芍三錢澤瀉一錢車前子一錢龍膽草一錢水煎服溫補救目散熟地五錢當歸五錢白芍一兩山茱萸五錢甘菊花五錢葳蕤五錢枸杞三錢薏仁五錢柴胡五分車前子二錢白芥子二錢水煎服吐症吐症之虛實尤不可不辨不知虛實而輕用藥餌死亡立刻可不慎歟吐有朝吐暮吐飽吐飢吐蟲吐水吐之異朝吐者陽氣虛也暮吐者陰氣虛也飢吐者邪火之實也飽吐者寒邪之實也蟲吐者有虛有實虛則寒而實則熱也水吐者吐黃水為實吐清水為虛也朝吐之病乃頭一日之食至朝而盡情吐出也此乃陽氣之虛陽氣者乃腎中之陽氣虛而非脾陰之氣虛也若徒以人參白朮以健其脾氣亦終年纍月而寡效不助其腎中之火則釜底無薪又何以蒸夫水穀此其症胃氣不弱故能食之以藏於胃中而胃既藏一宿自當轉輸於脾矣而脾寒之極下不能化自然仍返於胃而胃不肯受而上反而出矣倘認之不清皆為胃氣之弱仍用參耆之類則胃益健而脾之寒虛如故何能使之下行哉況脾氣既寒下既不能推送則大腸久無水穀之養亦且縮小即或脾有殘羹剩汁流入大腸而大腸乾枯亦難潤導勢不得不仍返之於脾而脾仍返之於胃而胃仍返之於咽喉而上出矣治之法急於腎宮溫之方用八味地黃丸大劑煎服始能水中生火以煮土中之穀氣脾土熱而傳化亦易且大腸得腎水之滋潤則水穀亦可下達矣暮吐者朝食而即吐也亦有隨食而隨吐者此乃陰水衰之故胃中無液不能潤喉所以水穀下咽便覺棘喉故隨食而隨吐或朝食而暮吐也倘亦以胃之虛而錯用健脾開胃之劑愈助其火勢之炎蒸而食轉不能下咽矣法當用六味地黃丸湯大劑煎服或四物湯加人尿人乳亦大劑煎服庶幾可愈否則徒自苦而已矣飽吐者因先有風邪入於胃中飲食入胃而胃氣得飲食之勢難與邪氣相戰故一湧而出往往有一吐而病自愈者所謂吐之即發之也吐後用二陳湯加減調治之亦未為不可至於飢吐者腹中無食何以作吐蓋寒邪入腹挾腎水上凌於心驅其火而外出也此乃至危之症然而寒邪挾腎水而上衝者飽時亦有此病終不若飢時之吐為更重法當以熱藥溫之方用理中湯溫其命門之火健其脾胃之土使元陽無奔越而厥逆有返還之慶也蟲吐之症雖有虛實寒熱之異而蟲吐則一也吾定一方專治蟲而加減之可通治蟲吐矣方用定蟲丹服後萬不可飲之茶水約二時可飲矣此方乃殺蟲之聖藥而又不十分耗氣所以飲之而蟲死而痛亦隨之而定也水吐之病吐清水者乃脾氣之寒虛不若吐黃水者胃氣之實熱也故最宜辨清喻嘉言謂吐清水者有水窠之異不然何以吐水而絶不吐食耶其言則是而看症實非胃口之中那有更生一窠囊之理不知脾氣寒虛則水不能分消專聚於脾而不知一經泛濫則傾腸而出而胃中糟粕何以絶無此又有故存焉蓋胃氣之行原稟令於脾土裡病而表亦病脾病而胃亦病也脾之水既然上溢胃之水亦必然上行脾之氣使糟粕不出胃之氣亦使糟粕不出也喻生不知其妙以物理窺臟腑淺哉之見也此等之病必須健脾而加之重墮之品而不可單尚塞竅之藥以專恃乎阻抑之也方用遏水丹一劑而吐止再劑而全愈三劑而吐不再發蓋人參補氣而白朮止水二味原有奇功況又加茯苓等類以分消其水勢之滔天又用鹿角霜以止流而斷路又何至上吐之奔越哉定蟲丹白芷一錢苦楝根二錢枳殼一錢使君子十個槌碎檳榔一錢甘草一錢白薇三錢棐子肉三錢槌碎茯苓三錢烏梅三個水煎服如熱加黃連一錢寒加乾薑一錢實加大黃二錢虛加人參三錢遏水丹人參一兩白朮二兩茯苓一兩肉桂一錢乾薑二錢鹿角霜一兩水煎調鹿角霜末服瀉症瀉症多虛亦未嘗無實瀉也實瀉之症腹痛多不可手按完穀不化傾腸而出糞門之邊覺火毒燒焚裡急後重與痢疾正復相似但無魚凍瘀血而已此乃火勢借水橫行土隨水轉翻江破海而來其勢難於止抑投之茶水立時俱下投之米食即速傳出仍如故物似乎膀胱不化而脾胃無權大小腸盡行失令苟不治之得宜三晝夜必然歸陰此等之症萬中見一原不必細辨然世既有此病之一種吾又何可置而不論世人用脾約丸亦佳而終非一定不可移易之方吾今特傳一方以治此症神驗之極方名收脾湯先服未有止勢再服之無不止者神方也其虛症之瀉或脾瀉或腸瀉或腎瀉三症大約可包而治之法亦不相遠惟是腎經之瀉不特不可止水而兼且必須補水以止瀉人實難知非補水可以止瀉蓋水必得火而後能生補水者又不可不補火也補火者補命門之火也火在水之中徒補火則火且飛揚不能止瀉必於水中補火則火得水而生而水得火而止其中實有至理非漫然好辨也但脾瀉腸瀉與腎瀉從何以辨其虛實哉脾瀉之虛腹喜溫而不喜冷飲食能食而不能化面色痿黃手足懶惰此脾瀉之虛症也方用燥脾止流湯方中純是健脾去濕之品投脾之所好土旺而水自歸元也腸虛之瀉腹中時時雷鳴或作水聲大便不實小便清長者是此等之病亦要健脾助氣為妙而佐之實腸之品則瀉可除而腸之氣又旺可以傳導水穀也方用補腸至聖丹此方之妙妙在鹿角霜下行而固脫然不佐之人參健脾之藥雖用鹿角霜仍是徒然止脫而終不能生氣於絶續之時挽回於狂瀾無砥柱之地也腎虛之瀉必於夜半子時或五更前後痛瀉三四次五六次不等日間仍然如病人者此是腎瀉名為大瘕瀉也倘徒以脾胃藥止之斷不能愈必須用熱藥以溫其命門為妙方用溫腎止瀉湯此方雖補腎而仍兼補脾補腎以生其火補脾以生其土火土之氣生寒水之勢散自然不止瀉而瀉自止也收脾湯黃連五錢山藥一兩薏仁五錢車前子五錢茯苓五錢人參五錢肉桂五分水煎好用米糕粉炒熟調服之燥脾止流湯人參五錢山藥一兩芡實一兩澤瀉二錢吳茱萸五分炒乾姜五分茯苓五錢神麯五分水煎服補腸至聖湯人參三錢茯苓五錢薏仁一兩芡實五錢肉桂一錢山藥一兩鹿角霜末五錢水煎湯調服溫腎止瀉湯白朮三錢茯苓三錢熟地八錢附子二錢肉桂二錢車前子二錢北五味三錢山茱萸五錢山藥一兩薏仁五錢巴戟天五錢水煎服頭痛頭痛有虛有實實痛易除而虛痛難愈實痛如刀劈箭傷而不可忍或走來走去穿腦連目連鬢連齒而痛風痰壅塞於兩鼻之間面目黎黑胸膈飽脹叫喊號呼皆實症也倘以為虛而用補陽之藥轉加苦楚必以散邪去火為先而病始可去方名升散湯此方全是發散之藥必須與前症相同者方可用二劑而病去如失否則未可輕投也至於虛症頭痛有陽虛陰虛之分陽虛者脾胃之氣虛陰虛者肝腎之氣虛也脾胃之氣虛者或瀉後得病或吐後成災因風變火留戀腦心以致經年纍月而不效方用補中益氣湯加蔓荊子一錢半夏三錢一劑而痛如失陰虛者腎肝之氣不能上升於頭目而顛頂之氣昏暈而頭岑岑欲臥或痛或不痛兩太陽恍若有祟憑之此症若作陽虛治之不特無效而且更甚往往有雙目俱壞而兩耳俱聾者可慨也方用肝腎同資湯一劑而暈少止再劑而暈更輕四劑全愈此方妙在肝腎同治少加入顛之藥陰水既足肝氣自平肝氣既平火邪自降設不如此治法徒自於頭痛救頭風邪未必散而正氣消亡必成廢人而不可救矣升散湯蔓荊子二錢白芷二錢細辛一錢藁本五分半夏三錢甘草一錢水煎服肝腎同資湯熟地一兩白芍一兩當歸一兩川芎一兩細辛五分郁李仁五分白芥子五錢水煎好半鍾加入酒一碗其飲臂痛臂痛雖小症而虛實宜分蓋此等之症最難辨也實症若何其痛長長在於一處皮毛之外但覺苦楚按之痛更甚口渴便閉此實邪也用搜風散火祛痰之味自然有效苟若不然更添疼痛吾以外祛湯治之一劑而痛輕兩劑而痛減三劑而痛愈使邪從外入仍從外出也虛症若何其痛不定或走來而走去或在左而移右捶之而痛減摩之而痛安或作磈而現形或生瘢而見色口必不渴而痰結更深腸必乾枯而溺偏清白此真氣之虛而痰氣壅滯固結而然也若用祛風之劑而身原無風或用祛火之藥而體非實火即用消痰之劑而正氣既虛痰亦難去必須用健脾補腎之藥而後佐之去風去火去痰之品自然手到病除也方用衛臂散此方全不去治臂痛而單去滋肝益腎水木有養自不去克脾脾氣健旺自能運動四肢何致有兩臂之痛哉外祛湯白朮五錢防風三錢炒梔子三錢荊芥三錢半夏三錢烏藥三錢甘草一錢白芍三錢水煎服衛臂散黃耆一兩當歸五錢防風一錢白芥子三錢白芍五錢茯苓五錢熟地五錢枸杞子三錢薏仁三錢水煎服足痛兩足之痛亦有虛實其症與兩臂相同而少有異者蓋足居下流多感水濕之氣實症之生必為水腫按之皮肉如泥者是也虛症之生雖感水氣而不致腫脹之如泥骨中作酸時痛時止久之膝大而腿脹者是也實症宜瀉其水用牽牛甘遂各二錢煎湯服之即時獲效正不必俟其大腫而後治之也虛症不可瀉水宜補其氣而兼利濕溫其火而帶治其風之為得也方用顧足散此方之妙妙在用氣分之藥以壯其氣氣壯而後利水則水自出而邪自難留也顧足散黃耆一兩薏仁一兩芡實五錢白朮一兩車前子五錢肉桂五分防風五分茯苓五錢白芥子五錢水煎服齒痛齒痛人之最小之疾也然不得其陰陽之道最不能愈而最苦也齒之部位不同有臟腑之各屬然而各分臟腑之名目反致炫惑不若單言陰陽易於認識雖然陰陽終於何而辨之仍亦辨之臟腑而已矣大約陽症之痛多屬於陽明胃經之火此火多是實火發作之時牙床必腫口角流涎喉嚨作痛欲食甚難不食作痛汗出而口渴舌燥而便閉倘以補陽補氣之藥祛風殺蟲之方治之多有不效即或少有效驗亦隨止而隨痛牽連作楚者比比也法當用竹葉石膏湯一劑而痛輕二劑而全愈不必三劑也至於虛症之痛多是腎經之病腎水熬干腎火上越齒乃骨之餘骨髓無腎水以相資使致齒中作痛倘亦以祛風散火殺蟲之品急救之不特無濟於事而痛且更甚從前或一齒之痛後必上下之齒全痛矣法當用六味地黃湯加麥冬五味骨碎補治之一劑而痛失真奇異之法也二方治虛實之齒痛實為至妙惟是蟲牙作祟不可拘於虛實之分以五靈脂為細末先以淨水嗽口後以醋調靈脂含漱多時立時蟲死而痛除又不可不知也心痛心痛之宜辨虛實也古人云痛無補法是痛不可以虛實言也然虛可補而實可瀉心痛言虛實即宜言補瀉矣人恐不相信不知心痛有可補之道人未之知也如心痛之時晝夜呼號飲食難進此實火也斷斷不可用補一補而痛必更甚必有死亡之禍然而能於補中瀉火亦未嘗不可卻病蓋補正氣少而去火之藥多又何患乎補也方用先攻散治之一劑即止痛神方也論此方有白芍之酸收似乎不宜治火痛之心病誰知梔子枳殼貫衆各皆祛火散邪之藥而無芍藥以調和之則過於殺伐未必不使窮寇之死鬥妙在用芍藥以解紛則剿撫兼施實有人謀不測之機也至於可補之心痛亦因其虛而可補故補之也其痛必時重而時輕喜手按而不喜不按與之飲食而可吞此痛名為去來痛也去來痛原是虛症豈可執痛無補法而不用純補之藥哉吾今立一方名為消痛補虛飲一劑而痛如失二劑全愈不再發亦神方也蓋去來之痛全在心氣之虛少有微寒留於膻中之下寒遠則不痛寒近則少痛也此等之病往往有經歲經年而不愈者亦因人不敢用補邪無所畏留住於皇畿內地時時偷竊作祟耳今吾用大劑補藥以補其膻中譬如相臣得令英察精明必然擒賊小偷細盜焉敢潛住皇居左右哉此方之所以神耳先攻散芍藥五錢梔子五錢枳殼五錢貫衆五錢水煎服消痛補虛飲人參五錢白朮五錢茯神五錢枳殼一錢廣木香一錢白芍一兩當歸五錢甘草一錢附子一片重二分白芥子三錢水煎服脅痛脅痛之虛實又何以辨之脅痛屬之肝肝經本是至陰之位宜乎痛皆陰症也不知肝雖屬陰而氣則屬陽或一時感冒風邪兩脅作痛痰壅上焦中腕不痛結成老痰欲吐不能欲下不得亦最苦之症也法當用舒肝散風之藥逍遙散最妙之方也至於肝氣之虛一旦觸動怒氣傷其肝血亦兩脅作痛其症亦與前症相似但無欲吐不能欲咽不下之狀論理亦可用逍遙散以舒解之然而本方藥味雖佳而分兩缺重吾今更立一方名為平肝舒怒飲治因怒脅痛甚效或因鬱而作痛者亦無不神一劑而痛如失此方之妙妙在芍藥用至一兩之多則肝木得酸而自平況又佐之當歸之補血以生肝又佐之各品相輔之宜則肝氣之郁解而兩脅又何能作痛哉倘不知用此一旦用小柴胡等湯雖亦能去痰而曠日遲久不能如此方之神速耳平肝舒怒飲柴胡二錢白芍一兩炒梔子三錢當歸一兩白芥子三錢車前子三錢白朮三錢枳殼一錢丹皮三錢神麯一錢麥芽二錢山楂十粒水煎服腹痛腹痛之虛實又何以辨之腹居至陰之下以痛之皆陰症也既是陰症宜虛而非實矣誰知痛之不同有虛有實之異乎實痛何以辨之按之必手不可近此乃燥屎結成於大腸之內火迫於臟腑之間傷寒日久最多此病此乃實邪而非虛病之可比方當下之為妙仲景張公有大柴胡乘氣亦可選用然而非專治腹痛也吾今另立一方專治腹痛之症實有神效名為滌邪救痛湯此方雖有大黃之下邪而即有當歸生地之生血以活血總然有枳實之推蕩而無妨亦攻補並施之妙法也倘腹痛而身有寒邪未散本方中加柴胡一錢足矣余可不必增入一劑而邪散穢出身即涼而痛如失至於腹痛虛症大約畏寒畏食喜熱手之相尉喜健人之按摩蓋虛寒之氣留於下焦之故也其大便必溏而小便必然清冷一問可知無多深辨方用祛寒止痛湯此方妙在用白朮為君以利其腰臍之氣氣濕而寒溫之氣不能留於腹中自然邪從小便而出而疼痛之苦頓除也倘以輕清之味和解之未必奏功如神至此滌邪救痛湯大黃五錢紅花一錢生地五錢當歸五錢枳實一錢厚朴一錢天花粉一錢甘草一錢水煎服祛寒止痛湯白朮一兩肉桂二錢甘草一錢吳茱萸五分砂仁三粒藿香一錢人參二錢半夏一錢水煎服吐血吐血最難治之症虛實更不可不知吐血實症百中二三非感暑而得即大怒而成也其餘鬱症不可言實病矣暑症之成自家必然知道必有熱氣從口中而入一時不能外卻而吞入胸中便覺氣逆痰滯少頃傾盆吐血雖血既傾盆而出亦成虛症然終不可因其已失之血而謂是虛症以治之也法當解其暑熱而佐之引血歸經之品火散而血歸經絡雖身子微弱而血終不再吐也方用解暑至神湯一劑而血症頓愈不必再劑也大怒吐血以致肝氣大傷不能藏血亦傾盆而出但其色多紫不若傷暑之純紅也若見其吐血之多便為虛症而用黃耆補血之湯未為不可然終非治肝平怒之法肝氣不平吐血又何日止也方用平肝止血湯一劑而病如失再劑不再吐血矣此方妙在白芍用至三兩始能平其大怒之氣況肝中之血盡情吐出非芍藥之多何能滋潤又慮芍藥尚不足以平肝又益之以丹皮之涼血而佐之以柴胡之舒肝又恐漏卮之路熟加三七以杜其隙相製得宜所以奏功如神也此方服後必須六味地黃湯加麥冬生地當歸白芍各三兩為丸每日吞服一兩一月如平時也此又善後之計又不可不知至於虛症吐血或因房勞或因行役或因氣鬱皆能失血我有一方可以通治名為救生丹一連數服未有血症之不愈者愈後將此方少減一半終日煎湯作飲能服至三月者斷無再行吐血之理何至有少年夭亡者哉解暑至神湯青蒿一兩生地一兩人參五錢荊芥末炒黑三錢麥冬五錢玄參一兩白芥子三錢水煎服平肝止血湯白芍三兩丹皮一兩炒梔子三錢白芥子三錢柴胡五分三七根末三錢水煎調三七根末服救生丹熟地一兩生地一兩麥冬一兩人參三錢荊芥三錢三七根末炒黑三錢水煎調服發狂發狂之有虛實也發狂多是熱邪之作祟然亦間有虛火之發狂又不可不知也發狂之實症與治實狂之方法前文已載茲不再論但論陰虛而發狂者此症婦人居多鬱氣不伸思慕不遂一時憂憤遂成此症或披髮行歌或出門呼喚見男子則思其心上之人見女子則嗔其目中之刺或吞炭而食泥或毀容而割體人生抱病至此亦可憐也此皆肝氣實郁肝血乾燥兩關之脈必然沿出寸口所謂欲得男子而不可得者也此等之病必須大補腎中之水足以生肝而少加之以安心祛痰之藥又益之以解鬱降火之味自然羞愧頓生前狂自定方名解羞湯一劑即見神功二劑全愈不必三劑也吾傳方至此亦憐婦人之鬱而成此病也倘見左關之脈沿出寸口人未發狂之前即以吾方減十之六七早為治之又何至有花顛之患哉遠公可記之汝將來有治此等之病者故吾先傳此方也解羞湯熟地二兩白芍三兩柴胡三錢炒梔子三錢生棗仁五錢菖蒲一錢白芥子三錢茯神一兩麥冬一兩北五味二錢山茱萸五錢丹皮五錢當歸五錢香附二錢鬱金一錢水煎服耳聾耳聾之宜知虛實也耳雖屬於腎耳聾自然是腎水之虛以致腎火之旺故氣塞而不通老人多有此症補其水而少加開竅之藥漸漸耳聰亦不能一時奏效其症飲食如常手按之更覺無蟬鳴之響者是也至於實症或作蟬鳴或如濤響或發寒作熱飲食少思吐痰成磈面目青黃赤白之不同時而汗出時而汗止汗出覺輕汗止則重遇食轉加遇熱更甚此乃實聾之症也腎雖開竅於耳而胃為腎之關胃熱而反感風邪則火熱於中而邪壅於外腎氣且隨胃氣而助焰其竅反致遏塞故耳亦聾也重者常若有千軍萬馬洶騰之狀手按之其聾十倍者是也若用補腎補脾之藥益添其壯盛之氣而聾且倍常治之法宜用發散降火之劑我今留一方一治虛聾一治實聾也虛聾方名為清音湯此方不特補腎而兼去補肺補心補肝者謂何蓋腎水不能自生必得肺金之氣下降而後能生也心腎相通而耳之竅始不閉欲心之通竅舍肝氣之相生又何以通之耶故必補肝以生心火也況肝有補而後能瀉不致耗竊腎氣則腎水更有生氣矣此耳聾之所能自愈也但此方必須多服為妙蓋陰不能驟生而補陰不易遽補也實聾方名為止沸湯此方降胃中之火舒肝木之氣消上壅之痰不治耳聾而耳聾自聰也清音湯熟地一兩菖蒲一錢茯神五錢丹皮三錢玄參五錢薏仁五錢山茱萸五錢麥冬五錢北五味一錢柴胡五分當歸五錢白芍五錢白芥子三錢水煎服止沸湯柴胡一錢五分白芍五錢石膏三錢知母一錢甘草一錢青蒿五錢半夏一錢陳皮一錢茯神三錢神麯五分蔓荊子一錢水煎服瘡癰瘡癰皆熱毒也分其陰陽是矣又何必別其虛實乎不知陰陽之中各有虛有實倘分別不清用補用瀉亦自徒然故必辨其陰中之虛與陰中之實陽中之虛與陽中之實為妙陰中之虛若何瘡口平而不高而血色復加黯黑者是也陰中之實若何瘡口先平而後實血色紅潤者是也雖陰症俱是虛然而用補可分輕重吾今立一方皆可治之如見血色黯黑者此虛之極而寒之至也方中加附子一錢肉桂三錢一連數劑必然黑色改為紅色矣去附子再服自然瘡口生肉而愈也若先見瘡色紅者不必加附桂一連照前方服之必全痊矣倘不知陰症之虛實而亂用附桂適足以取敗也陽中之虛者若何瘡口雖高忽然色變而不紅此陽症欲變陰症之兆急宜用金銀花三兩歸身一兩附子一片重二分生甘草三錢煎湯飲之則色即變紅矣此方名轉陽化毒丹此症因病人原不十分健旺或又加色欲惱怒一時變症刻不可遲一見色變即用此方可轉危為安也陽中之實若何瘡口既高突而巍然而色又鮮紅而有光者是也方用瀉陽祛毒丹此方治陽症之毒最佳一劑即出毒二劑即毒淨三劑即全痊也若初起之時而高突者一劑立削神方也又不可不知之也轉陽化毒湯人參五錢黃耆一兩遠志三錢白朮一兩金銀花一兩生甘草三錢水煎服瀉陽祛毒丹金銀花一兩蒲公英五錢大力子三錢天花粉三錢生甘草三錢白礬三錢防風一錢水煎服大小便閉大便之閉結實有虛實之分實者乃風火結於臟腑之間故成閉結之症手按之而痛者是也虛者雖亦閉結覺肛門艱澀有不能暢遂之狀然手按腹中平平無痛飲食如常亦不十分緊急以此辨虛實斷斷不爽其方上文已講茲不再贅至於小便之閉塞虛實從何而分虛者乃膀胱寒甚內無火氣之化源故爾寒如冰凍而不能出其症亦覺腹痛而難忍然以熱手按之反覺快然服熱湯姜水則快飲寒湯冷汁而痛加者是也古人用五苓散多加肉桂亦能奏功但此方止可救急於一時而不能久遠之寬快吾今定一方實可長服有功實非旦夕之取效也方名溫水散此方利水而不耗氣去濕而溫其源久暫皆可奏功勝於五苓散多多矣治小便閉結之實症奈何蓋膀胱有火邪壅於小腸之口而不得下達且肺金又熱不傳清肅之氣而反傳溫熱之氣故點滴不能出以致腹痛而不可按急迫之狀往往至於雙目之紅腫而心煩意躁刻不可眠倘治之不得法有數日不便而死者矣我今定一方以救此危症方名疏浚丹此方之奇奇在用寄奴與王不留行二味走而不守又能瀉膀胱之火然過於下行加入升麻以提其氣譬如水注之法上升而下即降也況方中又有白朮薏仁以健脾土而仍是利濕之聖藥自然手到病除下喉而水如奔決也設徒以五苓散以利水而不知升提之法亦徒然利之也溫水散人參三錢白朮五錢肉桂二錢茯苓五錢升麻五分車前子三錢薏仁一兩蓮子三錢連心用水煎服疏浚丹車前子五錢劉寄奴三錢肉桂一分王不留行三錢升麻一錢薏仁一兩豬苓三錢白朮五錢水煎服大渴大渴之症自是熱症如何有虛實之分不知腎水大耗腎火沸騰變為消渴之病非虛而何往往有飲水一斗而反溺二斗者此水不知從而來往往使人不可測度雖消症有上中下之分而渴症則一也一者何腎水之虛以致腎火之旺也故治消渴之症無論上中下俱以補腎為先仲景張公定八味地黃湯原治漢武帝消渴之症其方實是神奇能遵守此方大劑煎服又何患虛渴之難治哉但醫道苦方之不多治法之最少我今再傳一方可與仲景張公並傳千古治渴症實是奇絶方名止渴仙丹早午晚各飲一碗一日而渴減半二日而又減半三日而渴止四日而全愈願人勿驚疑此方當遵守而敬服自能轉逆為安也其大渴實症舍竹葉石膏湯原無第二之方然而石膏過於酷烈吾今更定一方名為解渴神丹用石膏一劑之外即用此湯連服二劑以伐石膏之峻烈未為不可也大約實症之渴舌如芒刺目紅而突發狂發斑者是又不可不知止渴仙丹熟地三兩麥冬三兩玄參三兩天冬三兩肉桂三錢山茱萸三兩北五味一兩車前子一兩牛膝一兩芡實一兩水十碗煎三碗早午晚服每服一碗解渴神丹玄參四兩生地二兩茯苓一兩甘菊花一兩水煎服大汗大汗亡陽明是虛症如何分虛實耶不知發狂發斑之症非實而何其症大渴引飲飲水至半桶或一桶者其汗必如雨之來不可止遏蓋熱乘水勢而外泄也無水濟之往往無汗蓋乾燥之極汗從何來必得水濟之而汗乃出此汗乃實而非虛也法當用竹葉石膏湯大劑煎飲始能止汗而解其熱然而汗多必致亡陽石膏湯中亦宜多用人參以防亡陽之禍是實症亦宜用補也況虛症之汗乎虛症之汗或如潮熱而汗發星星或如珠之出而閣住不流或夜間有汗而晝無汗或下身有汗而上身乾燥見風則畏見寒則止大非陽症之見風寒而無畏也若誤認作白虎陽症而亦用竹葉石膏則死亡頃刻可不慎歟然則當用何藥以治之乎莫妙用補血湯也此方治之則汗止而身快吾加黑姜五味實有妙用歸耆乃生血補氣之品氣足則皮毛有衛而汗自然不致外泄當歸生血則虛熱自退而汗又何致外越耶黑姜守而不走五味酸而能斂自然氣血相安何從發汗所以相濟而成功也補血湯當歸一兩黃耆二兩乾薑炒黑二錢北五味一錢水煎服
