body:
  text: 卷之一陰症陽症辨傷風傷寒傷風與傷寒相似陰症與陽症宜知若不辨明殺人多矣雖仲景張公有傷寒專門之書我可不必再傳然而各有不同正不可不傳也傷寒之異於傷風者何以辨之一在感之輕一則感之重也傷風者傷寒之輕者也傷寒者傷風之重者也原無大分別苟不急治之則傷風者即變為傷寒矣蓋人之元氣最惡外邪人身一感風邪則元氣必然與邪相戰元氣旺者邪不能深入不能深入邪自然留於皮毛之間而不敢入於腠理之內不過一二日而邪散者正氣以祛邪之易也若正氣虛者則入於內而變為傷寒矣非傷風傷寒之有異也有異於人之元氣虛弱而已矣然則遇風邪之侵人者開手即用補正祛邪之藥何至傷風之變為傷寒哉若既已風入於腠理之內則邪即有陰邪陽邪之分矣大約入於腑則為陽邪入於臟則為陰邪矣是邪亦無陰陽之分亦分於人之臟腑之陰陽也然而腑又不同臟又各異又從何處以辨之哉我有一法辨症最易大約身熱而煩躁者陽症也身熱而安靜喜睡者陰症也雖陰症陽症中各有分別而此法終為千古不易之論也倘一遇風寒之侵體無論是傷寒傷風一劑即愈斷不須二劑也方名轉春丹此治初起之傷寒傷風也倘三日後身有不涼者此成傷寒之症矣亦不必問其陰症陽症吾有一方治之隨手而回春矣方即名回春丹一劑身即涼而邪即退再一劑全愈矣倘不聽吾言則變症蜂起矣可查仲景專門治之二方之妙各有深意轉春丹用桂枝與麻黃此胡可並用使邪入太陽者速散而邪不敢入於少陽之間且邪原未入內故可用補藥以和解之方中所以用芍藥先去平肝使邪之門路速斷用茯苓又引邪從膀胱太陽下行自然隨手奏功轉一陽於頃刻也回春丹之妙妙在不用芍藥桂枝蓋邪已入里已離太陽之經何必又用桂枝況邪由衛而入於少陽之經倘更用芍藥不特不能平肝而且引邪入肝矣蓋肝最惡邪侵於未近邪之時可以未雨綢繆而已近邪之頃難於及時杜絶余方中所以不敢用之也石膏麻黃青蒿之類純是入衛祛邪之聖藥單攻一府而邪自難留不得不從外而入者仍從外而出矣況方中又多調濟之品有不奏功如響者乎世人細思吾方即授之以治傷寒之症又安有殺人而比之刀刃者哉轉春丹桂枝五分柴胡一錢五分麻黃三分白芍五錢茯苓三錢甘草一錢陳皮七分白朮三錢半夏三分神麯一錢蘇葉八分水煎服回春丹麻黃一錢石膏二錢青蒿五錢柴胡二錢甘草一錢茯苓五錢當歸五錢陳皮一錢神麯一錢麥冬三錢生地三錢白芥二錢人參三分玄參二錢水煎服中風中風之症世人以風治之誤之甚矣蓋中風之症乃人陽氣虛與陰氣涸而中之也何嘗有風哉人見其疾之忽然而來有如暴風疾雨遂以風名之其實乃中氣而作中風也治之法一治風無不死者必須治氣始能有效然而中氣不同也內有中陽氣之虛有中陰氣之涸又不可不辨也中陽氣之虛者奈何其人一時卒倒口吐白沫痰聲如鼾目直視胡言亂語者陽症也若中陰氣之涸者亦一時卒倒目不知人時而躁時而靜欲睡不能言痰如鋸吐不絶口中流涎不止蓋陰症也二症亦相同者均不知人最難辨而最易辨也易辨者何辨之眼而已矣眼直視者氣虛也眼雙閉不開者陰虛也二症皆能遺尿手撒皆不治之症也然而遺尿手撒亦可治之大約十人中亦可救四五者非盡不可救也倘陽虛而中者用三生飲必須用人參二兩或三兩始可回生與其日後用之不若乘其欲絶未絶之頃多用人參可轉死回生之易也至治陰虛而中者又不可純用三生飲古無專方留下我今酌一奇方以救世人之陰虛中風者神效方名十寶丹一劑即回春也此方俱是純陰之劑然又何以兼用人參不知無陽則陰無以生必須加參為佐使則陰生於陽之中而陽回於陰之內兩相須而兩相成也苟或舍三生飲以救陽虛之中風而改用祛風祛痰之藥我未見能生者即或用三生飲矣而少用人參多加祛痰之品即或不死未有不成半支風與偏枯等症以三生飲治陰虛中風亦無不死者苟聽吾言用吾之方自慶生全倘怪吾藥品之多改重為輕恐難免半支偏枯之症矣願人敬守吾訓蓋吾之方必須照吾分兩以治初中之時不可妄自加減或用此方之後以病人脾胃之弱量為加減亦未為不可但切不可加入風藥一味以殺人於俄頃也慎之慎之十寶丹麥冬三兩熟地三兩山萸二兩白芥子二錢人參五錢菖蒲一錢茯苓五錢沙參五錢五味三錢丹皮二錢水煎服吐症大吐吐症多是胃氣之傷然而胃氣不同有陰陽之別如吐而有聲或痛者陽症也倘吐而無聲又純是清水或今日飲食而明日盡情吐出者乃陰症也或腹中不痛或遇寒即發無非陰症倘辨之不清妄自用藥必致殺人我亦更傳一法以辨陰陽之殊亦看舌之滑與燥而已矣大約陽症口必渴而舌必燥陰症口不渴而舌且滑也治之法陽症之吐用方名為引火止吐湯此方之妙妙在茯苓至一兩蓋火勢之上衝由於水道之下閉用茯苓以健胃又利水下行黃連止心火余俱調和得法自然火不逆而水下通又何至吐逆之生耶至於陰虛作吐實為難治不比陽吐一劑便可奏功也蓋陰虛而吐乃腎中之火虛也腎火既衰則脾無火養食留脾中成為陰寒世界下不能化自然上湧而吐矣法當溫補命門之火使火生水中然後土生火內方用濟火神丹服後即用飲壓之一劑輕二劑更輕十劑愈三十劑全愈矣蓋陰病之吐其來非一日矣不大補之則陰不能生而陽不能化或求速效再加人參三錢於方中可減十分之二然終不若原方之妙蓋病是純陰不必再借陽藥況方中原有白朮陽藥在其中矣又何必更用參之多事哉人不知生病之重惟求速愈或改用吾方或別求治病未必不反害之也引火止吐湯黃連一錢茯苓一兩白朮五錢陳皮一錢神麯一錢麥冬一錢人參二錢砂仁一粒藿香五分生薑三片水煎服濟火神丹肉桂三錢熟地一兩山萸五錢五味二錢茯苓五錢山藥一兩肉果二枚白朮一兩芡實五錢水煎服瀉症瀉症瀉有傾腸而出者最可畏之病也倘治之少遲必至氣絶而亡但瀉中有陰陽之分不可不急辨之也如大瀉五六十次或百餘次或數百次純是清水完穀不化人以為寒也然其中亦有熱症但寒症水瀉心腹不痛大腸不後重作楚若熱症之瀉也不然必腹痛不可按有後重之苦倘不辨明而用藥下喉必死矣吾今傳二方一治陰症一治陽症也陽症用車前茯苓最是利水之品而白朮又是健脾去濕之藥加入肉桂以取其氣引入膀胱同澤瀉同群共濟自然定亂扶危轉禍為福又何必用人參以救絶哉倘富貴之人不妨用人參五錢或一兩為妙我傳方不入參者欲救貧窮之客也方名導水止流湯其治陰症之瀉則又不同雖此方亦可相通而終不可執之以概治也另傳方者名為扶火消水湯二方之妙各有深意前方瀉水而不耗其氣後方補火而培其氣也導水止流湯車前一兩茯苓一兩白芍一兩甘草三錢肉桂一分陳皮一錢白朮五錢神麯五分澤瀉五錢水煎服扶火消水湯白朮一兩車前五錢山藥一兩芡實一兩薏仁五錢肉桂三錢五味二錢茯苓五錢水煎服瘧疾瘧疾皆起於外來之風邪然而內無痰與食終不能成瘧也雖然無痰不成瘧與無食不成瘧雖感於外來之風邪然亦內之陰陽之氣各有不足三者始能相合而成瘧然則烏可不辨陰陽乎若陽症之瘧也必發於晝或一日一發或兩日一發必寒多而熱少其勢若盛而其病實輕蓋陽氣能與邪氣相戰故作戰栗之狀而齒擊有聲也若陰症之瘧亦有一日一發者或兩日一發或三日一發然發之時必發於夜發必寒少而熱多齒不戰擊身痛亦不甚口必不十分大渴其症似輕而實重雖二症皆是邪侵而成而治之法均不可徒治其邪但補其正均能愈瘧原不必更為逐邪之計也然而補正之中而少帶散邪之品未為不可用之得當病去如掃吾今立二方一治陽瘧一治陰瘧陽瘧方名為扶陽散邪丹一劑輕二劑全愈不必三劑也凡陽瘧不論一日二日無不全愈神方也陰瘧方名為益陰辟邪丹無論一日二日三日四劑全愈倘四日兩頭髮之瘧久經歲月者方中藥料加一培增入人參五錢亦四劑全愈但愈後必須多服十全大補湯不致再感而重發也倘人不信吾言動用祛邪之品置陽氣陰氣於不問雖心欲去瘧適所以堅瘧鬼之城也扶陽散邪丹人參一錢白朮三錢柴胡二錢半夏三錢青皮一錢鱉甲三錢當歸三錢生何首烏三錢山楂二十粒甘草一錢水煎服益陰辟邪丹熟地五錢當歸五錢白芍五錢何首烏五錢白朮五錢茯苓五錢鱉甲一兩白芥子五錢柴胡一分山楂十粒水煎服痢疾痢亦不同有陽痢陰痢之分世人不知也皆為濕熱所致動言痢無止法而不辨其陰陽之異故往往殺人可慨也陰陽之痢內經亦未分別我今日亦泄天地之奇大約便血腹疼後重噤口者陽痢也腹不痛以手按之而快者糞門無急迫之狀日能食無血而白痢者乃陰痢也雖用藥得宜一方可以兼治然終不識症之陰陽猶為不知痢症之人也不可不明辨之庶幾用藥可分輕重尤易奏功如響吾今立二方一治陽痢一治陰痢陽痢方名為掃痢神丹一劑即止血二劑即止痢不必三劑也陰痢方名為化痢仙丹一劑輕二劑止三劑全愈人見血痢為重而不知白痢感於陰分未嘗輕也但陽痢火重而濕輕陰痢火輕而濕重耳陽痢之方妙在用黃連於大黃之中使火毒迅掃而去不久留腸胃之中陰痢之方妙在用芍藥之多平肝以扶脾土使土安而水易去其餘皆是祛逐邪穢之物各用之咸宜所以奏功尤易也掃痢神丹黃連三錢當歸五錢白芍五錢廣木香一錢檳榔一錢枳殼一錢大黃五錢車前子五錢水煎服化痢仙丹白芍一兩當歸五錢枳殼一錢蘿蔔子三錢檳榔一錢甘草一錢車前子一錢水煎服癲狂癲狂之症世人以癲為陰以狂為陽是矣然而癲之中未嘗無陽症狂之中未嘗無陰症也何以見之癲如羊癲牛馬之症此發之陽氣之不足陽虛則陰邪自旺此謂之陰症宜也然而其中又有花癲之病見男子而思親逢女子而不識呼喊叫號晝夜不止倘亦為陰症而用桂附之品則立刻發狂而死矣狂如登高而歌棄衣而走見水而入此發之陽邪之有餘謂之陽症宜也然其中有似是而非又不可不辨如見人則罵逢物則瞋燥擾不寧欲睡不安欲行不得口渴索飲見水則止倘亦視為陽症而投之竹葉石膏湯下喉即死矣然則二症終於何處辨之亦辨之於兩目有神無神而已如陽症則目必紅而陰症則目必白也吾定二方一治陽癲一治陰狂之症陽癲方名散癲湯此方之妙妙在白芍用至一兩自能平肝梔子用至五錢自然散其鬱結之火其餘柴芥術苓皆去痰去濕之妙品自然心清而火降脾健而癲除也陰狂方名解狂散此方之妙妙在用玄參二兩於群補真陰之中解散其浮遊之火木足而火自消亦火息而狂自定也苟或辨之不清妄投藥餌生死存亡正未可定矣散癲湯白芍一兩白朮五錢當歸五錢炒梔子五錢菖蒲五分茯神三錢甘草一錢白芥子三錢丹皮三錢柴胡一錢陳皮五分水煎服解狂散熟地一兩白芍五錢當歸五錢山茱萸五錢麥冬五錢北五味一錢玄參二兩白芥子三錢菖蒲三分生地五錢水煎服咳嗽咳嗽初起多是陽邪之感咳嗽日久多是陰氣之虛然亦不可拘於此論也有初起而即是陰虛者有日久而仍是陽虛者又不可不辨也何以見初起之即犯陰經也如日間不嗽而夜間嗽者或朝咳之輕而夜咳之重者雖有風邪襲之終是陰虛使然開手即宜用補陰之味而佐之散風之品則邪易去而正氣不耗也何以見日久之猶是陽經也如嗽必抬肩咳必聲振吐痰而結成黃塊塞鼻而長流清涎或晝重而夜反安然或坐躁而臥轉寧貼此陽氣之未虛而邪氣憑之而不散也必須仍用祛風蕩痰之品而少兼之滋陰之味則邪自散而陰氣不傷也吾今留二方一治陰經之咳嗽一治陽經之咳嗽陰經方名護陰止嗽丹此方有調濟之宜看甚平常而奏功實神也陽經方名散邪止嗽丹此方雖是散邪而仍然補陰而不補陽者何故蓋陽既旺而邪自難去補益其陰則陽氣自平陽平而邪亦難留矣倘不知陰陽之異即一味偏補之則陰不能生而陽不能化不特咳嗽難愈而且變症百端矣可不慎哉護陰止嗽丹麥冬五錢紫菀五錢百部五錢天門冬三錢熟地五錢桔梗二錢甘草一錢白芥子二錢玄參三錢沙參五錢陳皮五分款冬花五分水煎服散邪止嗽丹柴胡一錢白芍五錢黃芩一錢石膏一錢桔梗一錢甘草一錢生地五錢麥冬二錢茯苓三錢半夏一錢陳皮五分水煎服大小便閉大小便之閉塞不通也人皆謂之火然火亦有陰陽之別陽火而成閉結人易知陰火而成閉結人難識也先言大便之閉寒邪火逼迫於大腸之中燒乾大腸以致腸結而痛手按之不可近者必須用祛蕩之品而大瀉之否則邪留於腹中必變為譫語發狂之症矣此等之病乃陽火作崇也若夫腎水虧損不能滋潤於大腸以致糞如羊屎者往往有經月而尚未便者雖覺急迫而終亦不甚忍至二三日而如前不相異老人多有此症乃陰火作崇也陰火者相火乃虛火也腎火之有餘實腎水之不足也若亦以下藥下之是因其陰虛而復虛之也去死不遠矣吾今定二方一治陽火一治陰火治陽火方名利火下導湯此方雖有大黃之行火麻之潤而仍以當歸為君則補多於下亦止因勢利導而終非過下亡陰也治陰火方名為升陽下陰湯此方之妙妙在熟地純陰之藥為君而佐之地榆蓯蓉火麻之潤尤妙用升麻升提清氣則穢濁自然下行又何必加入大黃之多事哉再言小便之閉塞小便之通在於膀胱之氣化膀胱乘於火邪則小便必點滴不通其症必氣急面紅心欲嘔而胃作酸腹欲脹而腸欲斷兩目雙赤狂燥不寧此陽症也苟或小便雖急而非點滴之不通氣不急面不紅目不痛腹脹而喜按胃安而難餐此陰症也設不辨其陰陽而輕用開關之劑亦半死半生之道也夫陽症易治而陰症難治者何也亦不取陰症而一辨明之耳蓋小便之通雖本於膀胱之氣化然膀胱畏火而又未嘗不喜火也多火則膀胱之氣化不及行無火則膀胱之氣化又不能行也膀胱之陰虛則水道已成水凍之窟又何能通陰寒之水哉故小便亦閉塞而不通也吾今亦立二方一治陽症一治陰症陽症方名清水至神湯一劑即通車前利水而不走氣寄奴逐水而不傷陰升麻升提而反得下降之宜白果引入任督之路以瀉水之氣直入膀胱實有妙用也陰症用益火濟水湯此方之妙妙在純是補陰而不去利水用肉桂之一味以轉陽和自然雪消春水冰泮而溝壑皆通也倘止去通水則膀胱愈寒必成牢不可破之堅城矣利火下導湯大黃三錢當歸一兩紅花二錢赤芍藥三錢厚朴二錢枳實一錢柴胡八分火麻子三錢水煎服升陽下陰湯熟地一兩當歸五錢地榆一錢火麻子一錢升麻一錢生地五錢麥冬五錢肉蓯蓉五錢洗去鹽水水煎好加入人乳半碗服清水至神湯薏仁五錢白果十個升麻五分車前子一兩澤瀉三錢劉寄奴五錢水煎服益火濟水湯熟地一兩山藥五錢茯苓五錢山茱萸五錢牛膝三錢肉桂二錢麥冬五錢車前子三錢薏仁五錢水煎服心痛心痛從來言無真正之病不知心痛未嘗無真也但有陰陽之分耳大約陽病之痛犯心者多不救陰病之痛犯心者多難醫陽病乃火也火邪犯心有膻中之障隔而火勢不能直衝於心瀉其胃中之火而心安矣其故何也邪火與心火本是同類火與火合氣焰雖殊而熱性何殊也原無相剋之嫌故火退而君火自息何至有自焚之禍若陰病乃寒也寒邪直犯乎心雖有膻中之障隔而寒氣衝天直中皇居相臣不當其鋒先自逃遁於他處而天王有不下堂而走乎蓋寒水克心火立時可以撲滅較陽症而更重也故朝發夕死夕發旦死醫之少遲已多不救況用藥之不得其宜何怪其驟亡也人見其亡之驟謂其真正心痛其實非真正心痛也治之得宜何嘗不可救哉然則心痛之陰陽又烏可不辨之乎若陽症也必徹夜竟日疼痛呼號雙目必紅口必渴引飲得涼水而少止與之食而更痛手不可按按之而痛必甚身上必然有汗日重而夜少輕此乃邪火作祟於胃中上衝膻中耳用瀉火神丹下喉而痛即定矣此方之妙妙在梔子用之太多始能直折其鬱抑之火而蒼朮茯苓又去其濕濕去則不生熱而火勢自衰又加之貫衆以去穢乳香木香以止痛用甘草之多則梔子不至太涼反得其調劑之宜而枳殼化食食消則火隨食而下行矣又慮邪火大旺若不順從其性則火勢炎上恐拒隔而不受用乾薑之炒黑去其太熱引梔子之類於下行又得其前導之功也藥性既然相宜功效豈不立奏乎所以甫下喉而痛即定也若陰症也必感寒而得之其症小腹先痛而後入心口吐清水與之茶即吐出手足青甚而卵縮角弓反張此陰寒之氣犯心其來甚速苟能以生薑半斤搗碎炒熱敷於心腹之間則寒邪少減即用生薑三兩搗碎飲之亦能生者然終乃一時急救之法而非萬年濟人之術也用祛寒定痛湯救之實神刻不可緩速行救之下喉亦生否則難救矣此方之妙妙在用白朮之多直入腰臍之內者何也寒氣之入原從臍內先入若不急杜其來路則邪無顧忌往前直奔心包之絡如何當其賊勢之橫行余故用白朮以絶之也然非多加則勢孤力薄寒邪亦何所畏而反顧哉故必多加而後可以取效然徒用白朮之多而無附子肉桂之熱藥是猶兵衆而將非摧鋒陷陳之帥則兵卒不前賊又何所畏忌故必用附子肉桂也然徒用附子肉桂斬殺誅戮而不分散寒邪之勢則敵人團聚尤難解紛余所以又用茯苓引寒邪之下行也又慮心君寒甚無火以溫其中譬如群賊圍困皇宮雖有勤王之將而無導引之師則外雖有聲援之兵而內無接應非得親信之臣又何以交通內外余所以又用菖蒲引桂附人心而衛君也願人敬守吾方以治真正之心痛無不手到成功倘見病勢少輕前二方少減分兩亦未為不可瀉火神丹梔子五錢白芍三錢乳香一錢廣木香一錢貫衆三錢甘草三錢枳殼一錢炒黑乾薑一錢茯苓五錢蒼朮三錢水煎服祛寒定痛湯附子三錢白朮三兩肉桂三錢人參三錢菖蒲一錢茯苓五錢水煎服腹痛腹痛多是寒熱之二症雖有氣痛蟲痛食痛之殊然大約以陰陽二字足以包之母論食痛蟲痛氣痛也其陰症之痛如時而痛時而不痛或夜痛而日不痛或飢痛而飽不痛或不按而痛手按之而不痛皆是陰症之痛也其症口吐清水者有之喜熱湯者有之索飲食者有之喜擁被而臥者有之面青手冷口必不幹痰必不結此等之症不可用寒藥治之吾有一方甚效之極方名安腹止痛丹此方之妙妙在用白芍以平肝使肝木不來剋土又佐之健脾去濕去痰去食之劑而後調和得宜自然奏效如神倘或有蟲亦能制縛而不痛矣蓋肉桂一味原能殺蟲故耳若陽症之痛必日重而夜輕必痛不可手按得食則痛更甚口必渴痰必黃目必紅赤舌必燥手足反寒而戰大便堅實小便必黃赤而便難皆火之作祟而蟲與食之不化也或因氣惱而得或因酒醉而成或過食燔熬烹灸而得治之法不可以寒藥折之吾有一方治之最妙方名清解止痛丹此方亦妙在用芍藥蓋痛症非芍藥不能和故必以此為君要佐使之得宜又何患芍藥之酸收哉攻邪之內用芍藥為君所謂剿撫兼施自成仁勇先居必勝之勢以攻必散之病有不奏效如神者乎腹痛雖小疾而陰陽最不可不辨明者世人往往因小疾而治之不得法遂成大病者多矣我所以不憚煩而傳腹疼之一門也安腹止痛丹白芍五錢甘草一錢肉桂一錢乾薑一錢白朮五錢麥芽二錢山楂十粒半夏二錢水煎服清解止痛丹芍藥五錢枳實一錢白朮一錢山楂二十粒厚朴一錢石膏二錢甘草一錢白芥子三錢茯苓三錢柴胡八分當歸三錢炒梔子二錢水煎服頭痛頭痛之症人以為陽之病也然陽虛而頭痛與陽實而頭痛者有殊蓋陽虛之病即陰虛之症也陽氣之虛以致陽邪之旺倘陰氣不衰則陽邪有制何能作祟乎然則頭痛不可盡言陽症也吾今辨明有陽虛之頭痛有陰虛之頭痛或曰頭乃六陽之首陰氣不能到頭如何説是陰虛之故不知陰氣到頭而還而陽氣既衰不能接續陰氣以致頭痛雖是陽虛之故而實亦陰氣之衰陰氣苟旺亦能上接夫陽氣也陰陽原兩相根亦兩相接原不可分為二也惟其一偏之虛遂至兩相之隔矣然則治之法何可不辨陰症與陽症乎陰症之痛也顛頂若暈而頭重似痛不痛昏昏欲睡頭重而不可抬非若陽症之痛之甚也其症朝輕而晚重身胝又不覺十分之重此乃腎水之衰而肝氣克脾虛火升上之故也方用平顛化暈湯治之自然平復但非一二劑可以奏功蓋陰病多無近效非藥餌之不靈萬勿責之近功可也此即四物湯之變方妙在用桔梗細辛於補陰之中陰足而二味解其頭之暈是顧陰為本而散邪為末也若陽虛之頭疼多是風邪侵襲而然陽氣不虛邪何從入於脾胃之陽虛而氣遂不能顧首風邪因而相犯然則祛風而可不補正乎但其間陽氣之虛從何辨之亦觀之症以辨之其症必鼻塞而多涕口渴而多痰其痛必走來走去不定於一方而痛連齒牙或痛連於項背徹夜號呼竟夜不寐者是也吾有一方最佳方名解痛神丹一劑而痛如失此方用川芎至一兩而又佐之天麥二冬純是補陰之味如何治之陽虛有邪之頭痛也不知陽邪之旺終由於陰氣之衰補其陰而陽自旺陽旺而邪自衰況方中各有散邪之品用之於陰藥之中愈足以見其功用之大倘純用風藥未嘗無功然真氣散盡頭痛雖除而他病將見又不可不知也平顛化暈湯熟地一兩麥冬一兩細辛三分山茱萸五錢川芎五錢當歸三錢白芍三錢北五味一錢白芥子三錢桔梗一錢水煎服解痛神丹川芎一兩辛夷一錢黃芩三錢蔓荊子一錢細辛五分麥冬五錢甘草一錢天門冬五錢桔梗三錢天花粉二錢水煎服目痛目疾至難治而至易治也世人目疾往往有經歲經年而不愈甚至終身為廢疾者有之此豈目病之果難治乎亦治之不早與早治之不得其法耳蓋目痛有陰陽之分而辨之不可不預也苟辨之至清用藥得當隨手即可奏功何至有廢疾之成哉陽症之目痛必羞明惡亮大眥必赤如火而小眥反覺淡紅其痛必如刺戳流水結眵或鼻塞而不通或口渴而痰結或身發寒發熱而不止此皆火擁於心腹之間肝木氣鬱而成此目痛也若錯認作虛症而用溫補之藥則必變為兩眼青盲之症矣法當用開鬱去風之劑方用開目散此方之妙妙在舒肝木之氣而加之去濕散火之品不去治目而目之紅痛盡除大約二劑便可收功不必多用至於陰虛之目痛雖初起之時略有微疼而痛終不甚大眥不赤而小眥則紅如血者有之或小眥不赤而通身作桃花色者有之無淚無眵日間少快夜則反重雖羞明而不甚腹內時時作飢飢則痛較飽時覺重可見日而不可見燈大便溏者有之而小便反覺清長或夜發熱者有之而身間發汗不止此皆腎水虛耗不能滋潤肝木肝木自顧不暇又何能上潤於目必須用純補真陰之藥大劑吞服始能水足而虛火有歸經之日倘以寒涼之藥治之則必胃氣消亡而陽氣亦因之而喪或以風藥治之散其真氣而雙目終無紅退之時於是有昏花之症於是有拳毛倒睫之症終身成為廢人而不悟者比比也豫與言及此可勝浩嘆子今定一方救之實有神功名為養目至神湯此方前去補腎以生肝使水足而肝木得養肝木有氣而雙目自明矣但此方必須多服為妙服至半年不特昏花者可以重明而拳毛倒睫者亦能自愈蓋治本而末治在其中正不必又治本而又去治末也開目散柴胡二錢當歸一錢白芍三錢白蒺藜三錢半夏二錢陳皮一錢甘草一錢車前子二錢蒼朮一錢黃連一錢草決明一錢天花粉一錢水煎服養目至神湯熟地五錢山茱萸五錢甘菊花三錢地骨皮三錢當歸三錢白芍三錢茯苓三錢白芥子一錢柴胡三分枸杞子二錢葳蕤三錢水煎服雙蛾雙蛾之症乃少陰之火衝上於咽喉也其勢甚速甚急重者有點滴之水不能下喉者一連數日不進飲食而死者有之雖此症皆起於火而火有不同有陰火陽火之異苟不辨明而妄自用藥死亡頃刻非發在而亡即身青而死矣陽症如何喉中必先作乾燥之狀口必大渴引飲痰或結於胸膈之間欲吐不能欲咽不可喉腫如瘡小舌紅甚喉之兩旁內如雞冠外必作腫狀日間痛不可當夜間少安可寐舌必峭而目必赤也萬不可與溫熱之藥倘誤與之立時發狂矣此症只消用吐法便可全愈古人有用生桐油以鵝翎掃其喉中一吐出頑痰碗許即刻奏功者然亦有火亢之極一吐不能效者奈何然必問其飲食起居從前曾服過何藥倘服熱藥而致此者亦多其大便必燥結三四日不下或小便痛澀者放膽用吾湯以治之方名豆根神散一劑即安而雙蛾消歸烏有矣此方之妙妙在山豆根之多用此物最消少陰之實火然非甘草桔梗以伴之則下行而不上達故用二味為臣青黛亦止痛消腫之神藥以之為輔半夏天花不過消其頑痰則火易消散耳若陰症之雙蛾也有形而不十分作痛時而痛時而不痛夜痛而重晝痛而輕口必不幹不過微燥而已飲之涼水下喉即快少頃轉覺不安胸中膨脹大便如常小便清長即色黃而亦不作艱澀之狀此皆陰虛火動之故莫妙用八味地黃湯大劑飲之自然下喉而痰聲息腫痛除也蓋八味丸專補命門之火下熱而上熱自消龍雷之火非真火不能引之歸經耳然而二症往往有藥食不能咽者雖有此等妙藥何以下喉陽症用鵝翎掃其喉得小吐則水路少開便可用藥陰症則不可用吐法也蓋吐之甚則火益沸騰另有巧法用針刺手上大指指甲之旁少商穴刺星星出血其血色必紫必黑血出喉必少寬便可用地黃湯也如不肯刺更用附子為末以糡子調成攤在兩足之腳心一時辰便開水路便可用藥固是至妙之方也豆根神散山豆根三錢甘草三錢麻黃五分桔梗三錢半夏二錢青黛三錢天花粉三錢水煎服癰瘡癰瘡之症至凶至惡者莫過發背然而別其陰陽治之無難不知陰陽各瘡癰且皆不能奏效況易治乎故癰瘡之症但當問其是陰是陽不當計其何輕何重也大約各癰疽瘡症初發之時作痛作疼發寒發熱多是陽症陽症初起必然紅腫高突呼號叫喊自不能免若陰症則不然雖亦發寒發熱而疼痛反覺少輕初發之時必現無數小瘡頭以欺世大勢平陂而無高突之狀面必色黯不若陽症之面紅也治之少瘥死生反掌可不慎乎陽症之瘡乃火之有餘不能發泄或飲涼水水漿擁遏而成陽毒陰症之瘡必生於富貴之人或繁華而兼憂鬱或氣惱而帶房勞內水既干內火自熾蘊毒實深一旦潰發豈可以細小微劑望其生全乎與陽症治法大是懸殊然而陰陽雖有各別有毒氣總無大異也吾今立一方統治陰陽癰疽之各瘡無不神效但陽症小其劑陰症多其味也方名陰陽通治丹如若陰症各藥倍一半加附子一錢可也余不可亂加此方之妙妙在金銀花蓋此味乃補陰之妙品又是散邪解毒之聖藥然非多加則力薄而效淺吾所以用至三兩也陽症何以相宜蓋補陰正所以助陽氣之不足陽生於陰原有妙用也若陰症尤其所宜加一倍則力大而氣專加附子以達其經絡無經不入引當歸甘草之類同群共濟更易奏功也倘世人不聽吾言因循失治必致陰症變成壞症而陽症亦變為陰症而不可救者是則可憐也矣陰陽通治丹當歸一兩甘草三錢金銀花三兩車前子五錢水煎服脫症脫症之有陽陰也於何辨之亦辨之症而已非男脫為陽而女脫為陰也陽脫之症乃陽氣之衰陽精不能與陰精相合於是彼此相脫而身亡而陽精與陰精又從何處以辨之陽精者火也陰精者水也陰陽皆在於腎之中無陽則陰不生無陰則陽不化合則生而脫則死也而陽脫之症若何其陽必翹然不倒精盡而繼之以血者是也陰脫之症若何精盡而止其陽即痿身寒而無氣者是也治陽脫與治陰脫雖皆不可離去人參附子而其中又不可不少有分別治陽脫者宜多用人參而少用附子治陰脫者宜多用附子而少用人參吾今定二方一治陽脫一治陰脫或疑脫症不可服補陰之劑不知陰虛而脫無陰固不能驟生然而有參以生氣又有附子一枚以為君則純是大熱之藥若不助之補陰之味未免過於酷烈此中實有妙用倘附子不用至一枚斷難用補陰之藥也設若止用人參而少用附子則陰寒之氣逼人又安能回之無何有之鄉哉此陰脫陽脫之宜辨也苟知陰陽之辨見此等之症自然不至臨時忙亂而枉人之性命也陽脫方人參三兩附子二錢水煎服陰脫方附子一個人參一兩熟地五錢山茱萸五錢麥冬五錢水煎服汗症汗症之宜講也人以為發汗亡陽耳誰知亦有發汗亡陰之禍哉大約汗症多是熱而陽氣不能固者始有汗出故世人動以汗出亡陽為辭不知陽生於陰陰氣不能固而陽氣始能外泄亦有陽氣不能收而陰氣外逆者亦不可不辨也其陽症若何身必發熱口必發渴兩目必紅赤痰如黃塊或吐白沫其汗或如雨或如珠身必狂躁不安脈必洪大而數按之必有力而擊指登高而歌或棄衣而走或見水而入皆是陽症之汗也然陽之中有實有虛又從何而辨之汗出而身涼者為虛是矣然亦有汗出而身未涼者為虛虛者口舌必滑胎為白胎者虛也若見黃胎與灰黑之色與紅赤之色俱是實邪之火如此辨症斷斷不瘥虛者宜用補陽之味三黃之湯多加黃耆清中補之最妙若實邪之汗非石膏湯不能遏抑其火世人皆知其方余所以不留方也若陰虛發汗人最難知醫方亦無佳者吾先言其症而後定其方其症微微汗出如星星光景口必不渴舌必滑無胎或夜有汗而日無汗或動有汗而靜無汗或飲食有汗而平時無汗或身有汗而頭無汗皆是陰虛之汗也吾今留一方統治之無不神效此方之妙妙在補氣之味而加入於補血之中少加桑葉五味以止汗故陰氣自生而汗亦自止倘亦用寒涼之味以止汗汗雖止而正氣消亡非胃氣之寒即脾氣之壞矣論理人參亦可多加而余不用之者傷人之貧者多而富者少吾定此方以救萬世之人故不以難者強世人也黃耆三錢當歸五錢桑葉七片五味子十粒白芍一兩生地五錢麥冬五錢白芥子三錢水煎服痰症痰症百病多起於痰無痰則不能成病然痰之生必非無因非陽氣之衰即陰氣之乏也陽氣既衰而風邪外中則痰必生矣其痰之生也或如黃塊或如敗絮種種之不同或咳嗽之不已或嘔吐之不足而繼之膨悶治之法以二陳湯加減以治陽症之痰實有奇效然此方人多不善用之往往取敗者為何亦因其欠補陽氣之味也吾今加減其方名為加減二陳湯以此治陽症之痰無不神效汝見有火少加枯芩一錢可也陰症之痰吐如清水或如蟹涎口必不渴或腹內作聲或胸中作悶或夜重而晝輕或面紅而時白皆陰虛之痰也陰虛者非脾氣之不足則腎氣之匱乏也治之法健脾以化其痰補腎以歸其水此大法也更有一種下寒之甚火氣無多水波泛上必須補其腎中之火以生脾土則土旺始能攝水自然不化痰而化精又在人善於治之也腎火虛寒以致水泛者用八味丸最妙余不再定其方惟是脾腎之虛不至命門之火太微者可兼治脾土而不必純去補腎余定一方一劑輕二劑痰靜三劑痰消烏有矣此方之妙妙在純去健脾而又去瀉濕濕去則痰無黨可聚又有白芥子消其膜膈之痰而神麯砂仁又最是醒脾之品同群共濟有不奏功如神者乎加減二陳湯白朮三錢陳皮一錢甘草一錢茯苓五錢半夏一錢人參五分麥冬三錢蘇子八分水煎服後方白朮五錢山藥五錢芡實五錢薏仁五錢神麯五分砂仁二粒白芥子三錢水煎服腫脹腫脹之症有水腫氣腫血腫蟲腫食腫之別五症之中最易治者食腫耳不必分其陰陽以消食之品分消之即愈其次難治者則蟲腫亦不必分其陰陽蓋蟲腫即食之變皆傷脾陰而成健脾而濟之下蟲之品自然能愈世多留方然用之而不效者何也亦因看不清是陰虛之故而用陽藥以去之也吾今留一奇方專治蟲臌最妙最神方名化蟲絶神丹每日空腹白滾水送下一兩早晚二服服三日即有蟲從大便中出矣服十日腫脹消再服十日全愈不必盡服也此方俱是補陰之品又是殺蟲之藥臟腑不傷而反受大益潛移默奪不戰之戰正妙於戰也氣臌者乃陽氣之郁也世人以水臌法治之轉成危症者最多而氣臌從何辨之單脹於兩脅之間而手足不十分腫者是又不是蟲脹之單脹於腹也此等之病宜解鬱為主而解鬱又以舒肝為急吾定一方名為開鬱消腫湯此方用柴芍以舒肝氣則兩脅之脹滿自除又何必用大腹皮與檳榔之消克哉此方可用四劑之後略減其半加入人參三錢連服四劑氣臌自消亡於無事矣血臌之病非氣病也乃血症也半由於飲食之失宜半由於思想之太結遂成此病其症面黃而腹脹手按之如有物在而又不十分大痛手足必然細小者此是血臌也方用破血安全湯此方大黃用之以逐血然非以補中下之恐有排山倒海之憂今用白朮以固腰臍當歸生新去舊鱉甲牛膝入於至堅之中以動之又慮脾氣消亡又加人參以醒其氣安有脾不健而血不下者乎至於水脹之症實有陰陽之殊初感之時兩足如泥者乃水症也雖是水浸脾土亦因脾氣之虛以致邪水相犯然而脾氣之虛又因於胃氣之弱是脾陰之病即陽氣之衰也初起之時乘其陰氣之未虧即以牽牛甘遂二味各二錢治之水去如響又何水臌之難治乎至於陰虛而成水臌者雖亦是脾經之弱然非胃氣之衰蓋命門火衰無火以溫脾土以致水泛為痰留於胃脾之內漸侵入四肢非若水症之由外而內也法當用金匱腎氣丸補腎中之火以生脾胃之土而水自歸元終亦盡消烏有更有一種純是陰虛水亦上泛非腎火之不足者其症滿身流水囊大而不能臥大便如常小便亦利飲食知味者是法當用六味地黃湯一料煎湯恣飲自然奏功如神耳又不可不知之也化蟲絶神丹鱉甲一斤地栗粉一斤雷丸二兩生何首烏一斤甘草三兩神麯半斤棐子肉半斤枳實五兩檳榔三兩使君子三兩各為末米飯為丸開鬱消腫湯柴胡三錢白芍五錢鬱金三錢當歸五錢紅花五錢茯苓五錢薏仁二兩枳殼一錢甘草一分陳皮五分神麯三錢半夏一錢水煎服破血安全湯大黃一兩雷丸五錢白朮一兩枳實二錢肉桂二錢當歸一兩牛膝三錢鱉甲三錢人參五錢水煎服暑症暑症有中熱中暑之分大約中暑則陰症居多而中熱多是陽症何以辨之中暑之人半皆居於高堂大廈雖暑氣明是熱氣如何説是陰經之病不知陰氣之虛而後陽邪來犯仍作陰症治之其症必然腹痛頭暈吐瀉兼作甚則角弓反張霍亂吐瀉法當以健脾為主而佐之祛暑之藥實為得之方用卻暑仙丹倘角弓反張加入肉桂五分否則不可加也此治陰症之法如此若中熱陽症若何必得之肩挑負販之人於烈日火輪之下汗出如雨一時暴中當速以解暑為先而利水為次不可仍補其氣也方用化熱仙丹此方妙在亦用青蒿蓋青蒿最能去暑暑去而利其膀胱是暑從小便而出一劑而即愈也此治陽症之中熱又如此卻暑仙丹青蒿五錢人參三錢茯苓三錢白朮三錢香薷一錢陳皮五分半夏五分甘草五分水煎服化熱仙丹青蒿一兩香薷三錢石膏三錢知母一錢麥冬三錢甘草一錢陳皮一錢車前子五錢水煎服喘症喘症之宜分別也喘症一時而來者感外來之風邪也必氣急不能喘息聲如酣聲肩必抬上背心寒冷尉之火而不見其熱吐痰如湧泉人不得臥此乃陽症之喘也用參蘇飲一劑而輕再劑而愈或用小柴胡湯加減用之亦無不奏功如響故不必更立方法也惟陰喘之症最為可畏而又最難治療也其症亦作喘狀人亦不能臥得食則少減太多則䐜脹咳嗽不已夜必更甚此等之喘乃似喘而非真喘氣之有餘實氣之不足也蓋腎氣大虛欲離其根惟此一線元陽挽回於臍之上下欲絶而不遂絶之時也法當大補其氣而竣補腎中之陰使木火既濟始可成功否則氣斷而速斃矣方用回絶神奇湯一劑而喘輕再劑而喘定一連四劑自有起色而後始可加入桂附之品少少用之不可多用以劫奪之也蓋氣絶非參不能回於無何有之鄉腎虛非熟地山藥不能濟其匱乏然腎虛之故終由於肺氣之虛肺氣既虛腎水不能速生故又助肺氣之旺而後金能生水子母有相得之宜自然肺氣下行而腎氣上接何至有喘病之犯哉回絶神奇湯人參三兩熟地四兩麥冬三兩山茱萸二兩玄參一兩牛膝一兩白芥子三錢水煎服中邪邪有陰邪有陽邪雖辨之不清無致大害然而亦不可不辨者辨之清用藥得當自然易於奏功也陽邪之中大約罵詈之聲不絶於口發狂而走不欲安靜或呼見大頭之鬼或喊見金甲之神眼直視而口吐白沫者是也倘以熱藥投之立時死矣法當用醒邪湯治之自愈或疑陽症而何以仍用陽藥不知陽藥可以祛陽邪非人參之助正氣則邪不能退也陰邪之中雙目必閉安臥無聲或自言自語聲必低微或遺尿手撒或痰響如酣或身子發熱不喜見明者是也倘以寒藥投之亦立時身喪法當用扶正蕩邪湯治之此方之妙妙在用人參為君而佐之生棗仁為臣棗仁生用實有妙理蓋中邪之病昏昏欲睡不以棗仁生用則其氣更昏而不能醒生棗仁得人參更有殊功所以相佐而相合也陰寒非桂附不能祛邪然非參苓甘術一派扶正之藥亦不能奪魂於俄頃返魄於須臾也論理此方去附桂亦可兼治陽症之中邪終不若二方分治之更妙猶願人細為消息之耳醒邪湯人參三錢石膏一錢半夏三錢菖蒲一錢黃連一錢水煎服扶正蕩邪湯人參三錢白朮一兩附子一錢半夏三錢菖蒲一錢茯神五錢甘草一錢麥冬三錢丹參一錢當歸五錢肉桂一錢生棗仁三錢水煎服吐血吐血宜分陽症陰症者尤宜細辨蓋吐血犯人濁道不比衄血之犯清道也清道者氣道也濁道者食道也胃中無血而胃中有血吐血從口中而出者非胃中之血而何此血也因胃中有竅不閉而血乃妄行然而此血非止胃經一經之血也蓋心肝肺脾腎之血俱奔騰於胃腕之外而滲入於胃中胃不能藏所以上湧而吐也然五臟之血俱不可傷而腎經尤甚一傷腎則經年纍月而不可止遏矣蓋胃為腎之關關門不閉而腎中之血自然上升於胃又理之易知者也然同是五臟之失血又何以辨其為陰為陽此又有故蓋吐血無火不能吐血而無水亦不能吐血也無火吐血人能知無水吐血人難測其故又何也吾先言其有火者胃本土也而實有火在胃無土氣則吐變為火火存胃中自然挾血而上奔此陽火之焚非水不能相濟然而血乃有形之物一時傾盆而出欲急補其水一時既難收功不得不益其氣使氣生夫血氣生則氣行氣行則血止實有妙理存乎其間其症必口渴齒痛喉干目赤身熱便可知為陽症之吐血也治之法須用獨參湯一兩飲之最妙其次莫若當歸補血湯之為更神倘二方之中能調之三七根末各三錢再加入荊芥炒黑者為末同前二方飲之立止斷不再吐無奈世人不知妙法使吐血者致成癆瘵未必非吾輩天醫過於珍重方法不肯傳人之咎也至於陰症何以辨之或一日而數口或經年而咳嗽或痰中見絲或夜重而日無血迹或聲啞而聲嘶者是也治之法又不可專用參歸黃耆之品當改用純陰之味世醫六味地黃湯加麥冬五味最為相宜但此等之病非一二劑可以速效人見六味湯之迂緩而無近功也往往棄而不用遂至輕變重而重變亡吾今憐惜酌定神方可以長服而不必如六味丸之必須服至三年也此方大半補陰少加陽藥以生胃氣又用歸經止漏之品以塞其竅較六味湯為更神且此藥味平妥無有動性蓋血症最惡動也熟地五錢山茱萸三錢麥冬五錢玄參三錢天冬一錢車前子三錢荊芥炒黑三分人參三分山藥五錢薏仁一兩百合五錢三七根末五分水煎服夢遺夢遺之症十人常患六七人有此病半如廢人蓋腎不可瀉而可補如何可終日而自瀉之也此病之必須速愈而不可因循失治致成終身之漏卮也但其症有陰虛陽虛之分不可不辨不知陰陽而妄治之多見其寡效也陽虛之症氣必寡弱而陽痿往往見色倒戈一入夢中又偏鼓往直前而不肯已其先亦必見色而思慕容而視身不能竊而魂隨夢遊遂成此症當時即用補陽丘澀之藥亦易成功而無如人以為夢耳何足憂一而再再而三三而至四至五而玉關不閉矣余今傳一方最簡最易一劑輕三劑全愈至神之方不可思議者也如若初起之時一劑永不再發倘能消息吾方改劑為丸日服一兩亦奏奇功讀書之子當奉我為救命之神也至陰虛夢遺又復不同往往有絶非思想而夜間亦遺者此必天稟素虛又加色欲或看春圖而摹擬或讀野史而怡神或陶情花柳而娛色以至玉關不鎖見色則流聞聲則泄擦皮肉而輒遺終日呻吟全無健色當大補真元扶助命門之火始可回陽光之離照祛陰蕩之群魔閉其關門增其精水不必止遏而精自止也方名壯陽止精湯此方雖名壯陽而實補腎水止用巴戟以溫暖命門之火使水足以相濟而精自收攝於腎宮而不外遺此不止精而正所以止精也倘徒以牡蠣金櫻子之類以止澀其精而不補其腎中之水火吾日見其消亡而已矣芡實一兩山藥一兩人參五分蓮子三十個連心用生棗水煎服壯陽止精湯熟地一兩山茱萸五錢山藥三錢炒棗仁五錢芡實五錢人參五錢巴戟天三錢車前子三錢北五味一錢麥冬三錢柏子仁一錢白芥子一錢水煎服吞酸吞酸之症皆肝木之凌土也何以有陰陽之殊哉不知肝經雖屬陰然肝中有火以克脾克胃而陰陽遂分之矣大約脾受肝火之侵多屬於陰胃受肝火之犯多屬於陽耳犯於陽者心中嘈雜如火之焚燒飲之水而輒吐吐水必黃緑之色如醋之酸而不可聞者是也方用解酸湯治之此方之妙皆舒肝之聖藥而又解其火鬱之氣自然手到功成也侵於陰者雖胸中作酸而不甚今日食之必至明日吞酸而不可咽口雖作渴飲之水而酸更加吐出必純是清水可用熱物而不可用涼物者是也方用八味地黃丸實與症相宜然而丸方終不及煎方之速吾今定一方治陰症之吞酸有奇功也方名補陰化酸湯一劑少輕二劑即愈此方之妙妙在健脾多於補腎蓋脾健則水濕自去邪水既去而真水自生腎水行於脾之中脾氣即通於胃之上又何至胃口之寒出於吞酸而作吐乎倘不知補脾於腎中而惟圖止酸於胃上勢必變為反胃而不可止也解酸湯柴胡二錢白芍五錢蒼朮五錢炒梔子三錢茯苓五錢陳皮一錢厚朴一錢神麯一錢砂仁三粒枳殼五分香附二錢水煎服補陰化酸湯肉桂五分熟地五錢山藥一兩山茱萸三錢芡實五錢陳皮五分薏仁五錢車前子三錢附子一錢人參五錢白朮五錢白芥子三錢水煎服腰痛腰痛多是腎病然而腰痛不止腎病也腎病固是陰虛而腎病亦有陽虛者陽虛之病腰必冷氣如冰見寒則痛必甚不可俯仰食涼水冷飯之類必然痛甚而不可止陰虛之病痛雖甚而不十分冷飲涼茶食冷飯而亦不十分大痛以此分別陰陽實為得要而治之法亦少有微異也吾今立一方統治之各略加減無不神效名為健腰散陽虛者加肉桂一錢陰虛者加熟地一兩各照方服之病各全愈大約不必用至四劑也惟有一種陽症腰痛人最不知其故一時風濕驟侵腰痛不能轉側打恭作揖如千錢繫腰一般陽氣有餘而風邪作祟法當祛邪消濕其病立痊方用祛蕩湯一劑輕二劑病如失此方純去祛風蕩濕而又不損其正氣所以稱神而奏功愈奇也若錯認作虛症而用熟地補水之劑則濕以惡濕邪留腰脊而不去必成傴僂之症倘已成傴僂吾有奇方可以漸起之日服一劑三月傴僂可以起立神方也健腰散白朮二兩薏仁二兩水煎服祛蕩湯澤瀉三錢防己一錢柴胡三錢白朮五錢甘草一錢蒼朮三錢薏仁三錢豨蘞草二錢半夏二錢水煎服後方薏仁一兩白朮二兩黃耆一兩防風五分豨蘞草二錢肉桂五分茯苓五錢水煎服霍亂霍亂之症乃感暑熱之氣也因人之陰陽有虛有實而症遂分之矣大約霍亂雖有乾溼而犯暑邪則一也宜別其陰陽之虛實以用藥耳陽症之霍亂腹必大痛欲死而手足不致反張或吐而不瀉或瀉而不吐或吐瀉交作不可止抑不比陰症之欲吐而不能欲瀉而不得也方用香薷飲治之最佳然而香薷飲為世人妄用不知遵守我今重定香薷之飲一方蓋香薷性熱必熱藥冷飲始能順其性而奏功也我所定方與世上之香薷飲各有不同然而吾方實異於世人所定之方也凡遇暑天而患霍亂者用吾方煎飲無不下喉即定耳至於陰症霍亂此方亦可並用但宜加入人參三錢或二錢或一錢煎服亦佳但不可一氣服之必須緩緩呷之則暑氣自消而正氣來復非吐則瀉便慶回春矣設更用桂附熱劑以劫之雖亦有一時奏功者而亂定復亂往往變生他症又不可不知也香薷三錢白朮三錢陳皮一錢神麯一錢厚朴一錢茯苓三錢藿香五分砂仁一粒煎湯候冷飲之生産生産如何有陰陽之分如陰虛不能産即陽虛不能産也但何以辨其陰陽之虛也陽虛者氣虛下陷而漿水必然乾枯往往有不能轉頭而即欲産者倘以手腳先下此至危之症或用針刺兒之手足未為盡善必須多用參耆使氣足而兒身自能轉動不可止見其漿水之乾枯而徒用滑胎補水之藥以濡潤之也方用救胎兩全散一劑兒身即時活動二劑而兒頭到門立産矣蓋參耆原是純於補氣之藥二者同用更見奇功況又各用至二兩之多則氣生於無何有之鄉母健而子自不弱自然勇力出於尋常而轉身甚速也尤妙加升麻三分以少提其滯氣氣不滯而生産更自神奇也若陰虛不能産者又從何辨之兒頭業已到門而交骨不開水自然不能推送以至於此非大補其水又何以推送之易乎方用順推散一劑而交骨一聲響亮兒頭竄出而生矣倘兒頭先不到門此方萬不可加柞木以輕啓其門戶也切戒之戒之蓋當歸川芎原是補血之神品而柞木又是開關之聖藥自然相合而成功也倘舍此不用而徒用催生兔腦之丹恐徒取敗亡而已矣救胎兩全散人參二兩黃耆二兩升麻三分水煎服順推散當歸二兩川芎一兩紅花五錢柞木枝五錢益母草三錢水煎服小産小産多是陰陽之虛而又加好色以至胎動不安少有所觸使至墮落矣然則不急補其陰陽之氣血又何以安其胎乎但陽衰之症從何而辨其婦必然嗜臥懶於下床少若起居之勞倦便覺心煩頭暈飲食少思者是也方用安胎上聖湯一劑即安二劑不再動矣多服尤妙然亦不必至十劑也陰虛而動者人必瘦弱或夜熱而晝寒或夜有汗而晝無汗皮焦骨熱咳嗽時見者陰虛也方用養陰安胎湯此方專治陰水之虛而少佐之補陽之品前方純乎補陽而少佐之補陰之味總使陰陽不可偏勝而調濟之不可失宜也後方大約服四劑自然胎安如肯多服尤佳亦聽病人之意而醫者不必過強之也安胎上聖湯人參三錢白朮五錢山藥五錢茯苓二錢黃耆五錢甘草一錢杜仲二錢白扁豆三錢麥冬三錢北五味一錢水煎服養陰安胎湯熟地五錢山藥一錢茯苓一錢山茱萸二錢枸杞一錢杜仲一錢白朮二錢陳皮五分當歸身三錢人參五分水煎服倘熱甚加黃芩一錢不熱不必加也産後産後以大補氣血為主補氣血即補陰陽也然而産後又不可徒補氣血而不分陽盛陰衰陰盛陽衰而概用補劑也如産後身熱血暈此氣衰不能生血以致血暈不可止補血而尤宜補氣當用人參為君而佐之當歸川芎荊芥為妙如産後兒枕作痛手不可按而血暈此乃血氣有餘以致陽衰不能運動亦用前方加山楂十粒便可奏功惟有亡血過多僅存微氣或作寒作熱必須大補其血而少補之以氣為得方亦用前湯以當歸川芎為君臣以人參荊芥為佐使未嘗不可一劑奏功也産後原有專門吾所以止言大概大約陰虛者夜必沉困陽虛者日必軟弱耳以此用藥更為得宜汝再廣之可耳子嗣子嗣之當分陰陽也天師與仲景張公定方於從前而雷公又發明之於後吾可以不必再言之矣然而何故又言之耶蓋陰陽偏勝終難生子徒服溫補之品亦復何益必須知其陽虛者補陽陰虛者補陰庶幾陰陽兩得其平有子之道也如見人見色倒戈望門流涕正戰而興忽闌或欲再舉而終不振此陽氣之衰微又何疑哉方用扶弱丸以助之每日酒送下六錢或一兩服三日陽事振作非復從前之衰憊矣然三日之中母染色欲吾方始見神奇倘一犯吾禁止可少助其半而不能大改其觀非我傳方之不精也陰虛不能生子者又不可服此藥陰虛者必然多火火之有餘水之不足熬干陰精泄亦不多或太熱而驚其胞或水少而難於射或夜熱骨蒸汗出亡陰皆不能生子吾今立一方如法修合終日吞咽必能生子每日早晚吞下五錢或一兩亦可多之更美服至三月半年未有不生子者二方各有至理各有奇功要在人分別陰陽以為種玉之丹也扶弱丸人參六兩白朮一斤黃耆二斤巴戟天半斤肉桂三兩鹿茸一對遠志三兩覆盆子四兩柏子仁三兩熟地半斤北五味三兩山茱萸六兩肉蓯蓉一支龍骨二兩杜仲四兩驢鞭一具大而壯者佳麥冬四兩各為末蜜為丸酒送下每日或服六錢或一兩後方熟地一斤地骨皮一斤天門冬半斤麥冬一斤山茱萸一斤芡實一斤山藥一斤玄參四兩北五味三兩車前子四兩各為末蜜為丸
